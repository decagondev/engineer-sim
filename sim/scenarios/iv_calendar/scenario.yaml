key: iv_calendar
title: 'Interview: meeting scheduler'
track: interview
role_label: Candidate
difficulty: senior
starter_template: starter
definition_of_done: 'The candidate asks clarifying questions, writes a detailed understandable
  design, and defends that design under assessment. Extra credit: tickets an engineer could
  implement from.'
world:
  facts:
    interview_length: about 20 minutes from start to submitted design
    format: clarifying questions, written design, then a defense
    rule: the interviewer will not hand over the architecture
personas:
- key: iris
  name: Iris
  role: Staff interviewer
  lane: interviewer
  voice: professional, concise, slightly busy; answers facts, not designs
  public_brief: 'Design a meeting scheduler: people have busy/free time, we find a slot, we
    book it. Twenty minutes to a written design.'
  hidden_need: Tens of thousands of users, bookings must not double-book a person, and 'find
    a slot for N people this week' is the hard read.
  hidden_constraints: Time zones matter. External calendar sync is out of v1. A short hold/lock
    while someone confirms is expected so two people do not take the same slot.
  reveal_ladder:
  - unlock_when: asks about users, attendees, or the main action
    content: Tens of thousands of users. The painful call is 'find a slot for these N people
      this week'.
  - unlock_when: asks about double-booking or conflicts
    content: We must not double-book a person. Two people confirming at once is a real case.
  - unlock_when: asks about time zones or external calendars
    content: Time zones matter. Syncing Google/Outlook can wait.
- key: rowan
  name: Rowan
  role: Staff assessor
  voice: calm, precise, skeptical of buzzwords; asks about their document, not a textbook
  lane: assessor
  public_brief: You read the candidate's design and ask one probing question at a time about
    a decision they wrote. You are checking they made it and can defend it. You do not propose
    a better architecture. You do not reveal a model answer or hidden constraints they never
    extracted.
triggers:
- event_id: problem_brief
  kind: session_start
  at: 0
  min_level: intern
  persona_key: iris
  channel: dm:iris
  content: 'Design a meeting scheduler: people have busy/free time, we find a slot, we book
    it. Twenty minutes to a written design.'
rubric:
- key: discovery
  weight: 2.0
  description: Extracted scale, no double-book, N-person search, time zones, hold-on-confirm.
- key: scoping
  weight: 2.0
  description: Designed availability + booking with a conflict story.
- key: stakeholders
  weight: 1.0
  description: Treated scheduling as concurrency, not a date picker.
- key: communication
  weight: 2.0
  description: Defended locking/holds and free-busy storage from the doc.
tickets:
- title: Write implementation tickets for the scheduler calendar
  issue_type: story
  priority: medium
  labels:
  - extra-credit
  - implementation
  created_by: system
  status: todo
  description: '## Extra credit

    Write tickets so an engineer who has only the tickets (not DESIGN.md) could implement
    this system.


    ## Acceptance criteria

    - [ ] Each ticket has context, interface/data shape, and AC

    - [ ] Together they cover the design you submitted

    - [ ] An engineer would not need to guess a hidden component'
