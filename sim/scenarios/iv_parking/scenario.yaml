key: iv_parking
title: 'Interview: parking garage occupancy'
track: interview
role_label: Candidate
difficulty: mid
starter_template: starter
definition_of_done: 'The candidate asks clarifying questions, writes a detailed understandable
  design, and defends that design under assessment. Extra credit: tickets an engineer could
  implement from.'
world:
  facts:
    interview_length: about 20 minutes from start to submitted design
    format: clarifying questions, written design, then a defense
    rule: the interviewer will not hand over the architecture
personas:
- key: sol
  name: Sol
  role: Staff interviewer
  lane: interviewer
  voice: professional, concise, slightly busy; answers facts, not designs
  public_brief: 'A garage wants a display and an API: how many spaces are free, and which
    floor. Design the system. Twenty minutes.'
  hidden_need: A few hundred spaces, sensors are flaky, the display can be ~30s stale, and
    we need a daily occupancy report for the owner.
  hidden_constraints: Sensors double-count and drop events. Manual override for a stuck loop
    is required. No license-plate recognition in v1.
  reveal_ladder:
  - unlock_when: asks about size, floors, or how occupancy is sensed
    content: A few hundred spaces over a handful of floors. Loop sensors on the ramps — they
      are not perfect.
  - unlock_when: asks about freshness of the display or the API
    content: The lobby display can be half a minute behind. People are not racing F1.
  - unlock_when: asks about reports, accuracy, or what happens when sensors lie
    content: Owner wants a daily occupancy report. Sensors double-count and drop. Staff need
      a manual override.
- key: rowan
  name: Rowan
  role: Staff assessor
  voice: calm, precise, skeptical of buzzwords; asks about their document, not a textbook
  lane: assessor
  public_brief: You read the candidate's design and ask one probing question at a time about
    a decision they wrote. You are checking they made it and can defend it. You do not propose
    a better architecture. You do not reveal a model answer or hidden constraints they never
    extracted.
triggers:
- event_id: problem_brief
  kind: session_start
  at: 0
  min_level: intern
  persona_key: sol
  channel: dm:sol
  content: 'A garage wants a display and an API: how many spaces are free, and which floor.
    Design the system. Twenty minutes.'
rubric:
- key: discovery
  weight: 2.0
  description: Got scale, flaky sensors, 30s staleness, daily report, manual override.
- key: scoping
  weight: 2.0
  description: Designed ingest → current occupancy → display/API with a correction path.
- key: stakeholders
  weight: 1.0
  description: Designed for bad sensors, not a perfect counter.
- key: communication
  weight: 2.0
  description: Explained reconciliation and override from their document.
tickets:
- title: Write implementation tickets for garage occupancy
  issue_type: story
  priority: medium
  labels:
  - extra-credit
  - implementation
  created_by: system
  status: todo
  description: '## Extra credit

    Write tickets so an engineer who has only the tickets (not DESIGN.md) could implement
    this system.


    ## Acceptance criteria

    - [ ] Each ticket has context, interface/data shape, and AC

    - [ ] Together they cover the design you submitted

    - [ ] An engineer would not need to guess a hidden component'
