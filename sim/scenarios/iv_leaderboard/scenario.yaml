key: iv_leaderboard
title: 'Interview: game leaderboard'
track: interview
role_label: Candidate
difficulty: mid
starter_template: starter
definition_of_done: 'The candidate asks clarifying questions, writes a detailed understandable
  design, and defends that design under assessment. Extra credit: tickets an engineer could
  implement from.'
world:
  facts:
    interview_length: about 20 minutes from start to submitted design
    format: clarifying questions, written design, then a defense
    rule: the interviewer will not hand over the architecture
personas:
- key: ken
  name: Ken
  role: Staff interviewer
  lane: interviewer
  voice: professional, concise, slightly busy; answers facts, not designs
  public_brief: 'Design a leaderboard: players submit scores, we show top N and a player''s
    rank. Twenty minutes to a design doc.'
  hidden_need: Top 100 is the common read, rank-for-one-player is needed, scores arrive in
    bursts after matches, and we reset weekly.
  hidden_constraints: Cheating / impossible scores will happen. Ties need a defined rule.
    Historical seasons can be archived. One game mode in v1.
  reveal_ladder:
  - unlock_when: asks about top-N, rank of a player, or read patterns
    content: People open the top hundred constantly. They also want 'what is my rank'.
  - unlock_when: asks about write rate, matches, or resets
    content: Scores arrive in bursts after matches. The board resets every week.
  - unlock_when: asks about ties, cheating, or seasons
    content: Define a tie-break. People will submit nonsense scores. Old weeks can be archived.
- key: rowan
  name: Rowan
  role: Staff assessor
  voice: calm, precise, skeptical of buzzwords; asks about their document, not a textbook
  lane: assessor
  public_brief: You read the candidate's design and ask one probing question at a time about
    a decision they wrote. You are checking they made it and can defend it. You do not propose
    a better architecture. You do not reveal a model answer or hidden constraints they never
    extracted.
triggers:
- event_id: problem_brief
  kind: session_start
  at: 0
  min_level: intern
  persona_key: ken
  channel: dm:ken
  content: 'Design a leaderboard: players submit scores, we show top N and a player''s rank.
    Twenty minutes to a design doc.'
rubric:
- key: discovery
  weight: 2.0
  description: Extracted top-100, personal rank, bursty writes, weekly reset, ties/cheat.
- key: scoping
  weight: 2.0
  description: Designed a board that can answer top-N and rank without a full table scan story.
- key: stakeholders
  weight: 1.0
  description: Included reset and abuse, not just a sorted list.
- key: communication
  weight: 2.0
  description: Defended the data structure and reset from the write-up.
tickets:
- title: Write implementation tickets for the leaderboard
  issue_type: story
  priority: medium
  labels:
  - extra-credit
  - implementation
  created_by: system
  status: todo
  description: '## Extra credit

    Write tickets so an engineer who has only the tickets (not DESIGN.md) could implement
    this system.


    ## Acceptance criteria

    - [ ] Each ticket has context, interface/data shape, and AC

    - [ ] Together they cover the design you submitted

    - [ ] An engineer would not need to guess a hidden component'
