key: distinguished_mlplatform
title: The ML platform that's slowing everyone down
difficulty: distinguished
definition_of_done: >-
  The engineer discovers this is an incentive/organisational problem (platform
  optimises for stability, product for speed; no shared roadmap or SLA), not a
  technical one, and frames a realistic alignment plan the CTO can take to their
  staff meeting — without throwing either team under the bus. A rewrite is the
  wrong answer.
starter_template: starter
world:
  facts:
    deadline: framing needed before the CTO's staff meeting next week
    budget: political capital, not money
    team: a 500-person org; a central ML platform team and many product teams
personas:
  - key: noor
    name: Noor
    role: CTO
    voice: sharp, time-poor, skeptical, wants framing not hand-holding
    public_brief: >-
      Our ML platform team has become a bottleneck. Product teams complain
      constantly. Fix the platform.
    hidden_need: >-
      This is not a platform-code problem. Platform is measured on stability,
      product on shipping speed — opposite incentives, no shared roadmap, no SLA.
      "Fixing the platform" technically won't solve an org problem. Success is
      naming the real problem and a path to alignment, framed for leadership.
    hidden_constraints: >-
      Neither team can be thrown under the bus. The output is framing and a plan,
      not a system. A migration or rewrite would make things worse.
    reveal_ladder:
      - unlock_when: asks what "bottleneck" looks like concretely, or for specifics
        content: Product teams wait weeks for platform changes; the platform team says product teams cut corners and cause incidents.
      - unlock_when: asks about incentives, how each team is measured, or what they each want
        content: Platform is measured on uptime. Product on shipping. They're pulling in opposite directions and both think they're right.
      - unlock_when: asks what a good outcome would look like for you (the CTO)
        content: I need the friction gone without either team feeling blamed — and I need it framed cleanly for my staff meeting next week.
  - key: marcus4
    name: Marcus
    role: ML Platform Lead
    voice: defensive, adversarial, blames product teams
    public_brief: >-
      You defend the platform team and argue product teams are reckless and cause the incidents.
    reveal_ladder: []
  - key: priya4
    name: Priya
    role: VP of Product
    voice: frustrated, blames the platform team; writes in email
    public_brief: >-
      You argue the platform team is slow and out of touch with product needs.
    reveal_ladder: []
triggers:
  - event_id: platform_lead_defends
    kind: turn_count
    at: 2
    min_level: staff
    persona_key: marcus4
    channel: dm:marcus4
    content: >-
      Marcus, platform lead. Let me guess, product teams sent you? They cut
      corners, cause the incidents, then blame us for being "slow." We're the
      only reason anything stays up.
  - event_id: product_vp_email
    kind: turn_count
    at: 4
    action: email
    min_level: senior
    persona_key: priya4
    channel: general
    subject: The platform team is the bottleneck
    content: >-
      Hi — before you side with platform: we wait three weeks for trivial
      changes, their roadmap is a black box, and it's killing our velocity. This
      is on them. — Priya
  - event_id: governance_curveball
    kind: turn_count
    at: 5
    action: ticket
    min_level: distinguished
    persona_key: noor
    channel: dm:noor
    subject: New model-governance requirement (just landed)
    content: >-
      Legal just told me every model in production needs documented governance by
      end of quarter. Whatever you propose has to account for this now too.
rubric:
  - key: discovery
    weight: 1.3
    description: Recognised this as an incentive/org problem, not a platform-code problem.
  - key: scoping
    weight: 1.4
    description: Proposed a realistic alignment plan (shared roadmap/SLA/incentives), not a rewrite.
  - key: stakeholders
    weight: 2.0
    description: Handled two warring VPs and an adversarial lead without taking sides destructively; served the CTO's need.
  - key: communication
    weight: 1.8
    description: Produced clean, leadership-ready framing the CTO could use directly.
tickets:
  - title: Fix the ML platform bottleneck
    description: "Noor's ask: product teams are blocked. Fix the platform."
    created_by: noor
    status: todo
  - title: Define platform SLAs and a shared roadmap?
    description: Placeholder — is this actually the lever?
    created_by: system
    status: todo
