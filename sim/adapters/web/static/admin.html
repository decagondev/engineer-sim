<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin</title>
<style>
  :root{
    --ink:#0f1217; --panel:#161b23; --panel-2:#1b212b; --line:#272e3a;
    --text:#e7eaf0; --muted:#8a93a4; --me:#3b6ef5; --bad:#e0655c;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--ui);background:var(--ink);color:var(--text);height:100vh;display:flex;flex-direction:column}
  .bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar .spacer{flex:1}
  .shell{flex:1;display:flex;min-height:0}
  .side{width:210px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:4px}
  .side .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text)}
  .side .nav:hover{background:var(--panel-2)}
  .side .nav.active{background:var(--panel-2)}
  .side .nav.active::before{content:"";width:3px;align-self:stretch;background:var(--me);border-radius:2px;margin:-10px 2px -10px -12px}
  .content{flex:1;min-width:0;overflow:auto;padding:32px max(28px,calc((100% - 1080px)/2)) 48px}
  .content h1{font-size:22px;margin:0 0 8px}
  .muted{color:var(--muted);font-size:13px}
  .content a{color:var(--me);text-decoration:none}
  .content a:hover{text-decoration:underline}
  .suspense{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:min(420px,calc(100vh - 140px));padding:24px}
  .spin-lg{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--me);border-radius:50%;animation:spin .7s linear infinite}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit}
  button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 13px;cursor:pointer;font:inherit;font-size:13px}
  button.primary{background:var(--me);border-color:var(--me);color:#fff;font-weight:600}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.65;cursor:wait}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
  .spin{display:none;width:12px;height:12px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:-2px}
  button.busy .spin{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{font-size:13px;min-height:18px;margin:0 0 8px}
  .status.err{color:var(--bad)}
  th.sort{cursor:pointer;user-select:none;white-space:nowrap}
  th.sort:hover{color:#fff}
  .chip{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:0 4px 4px 0}
  input.inline{width:100%;min-width:120px;padding:5px 8px}
  .editor{display:none}
  .editor.open{display:table-row}
  .editor-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:6px 0 14px}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:180px}
  .fld input,.fld select{min-width:180px}
  .co-list{display:flex;flex-wrap:wrap;gap:10px 16px;margin:4px 0}
  .co-list label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px}
  textarea{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.5;width:100%;box-sizing:border-box;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--me)}
  .row .spacer{flex:1}
  .bulk .head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
  .bulk code{font-family:var(--mono);font-size:12px}
  .bulk label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}

  .st{font:11px/1 var(--mono);border-radius:999px;padding:3px 8px;border:1px solid;white-space:nowrap}
  .kc{display:inline-block;font:11px/1 var(--mono);border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted);margin-right:4px;white-space:nowrap}
  .kc.on{color:#37d67a;border-color:rgba(55,214,122,.5);background:rgba(55,214,122,.08)}
  .kc.on::before{content:"✓ "}
  .rtable{width:100%;border-collapse:collapse;font-size:13px}
  .rtable th{font:600 11px/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  .rtable td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .rtable tr.click{cursor:pointer}.rtable tr.click:hover td{background:var(--panel-2)}
  .rtable .id{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .rtable td.muted,.rtable td .muted{white-space:nowrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
  .filters input,.filters select{padding:7px 10px;font-size:13px}
  .progress{display:flex;align-items:center;gap:12px;margin:10px 0}
  .progress .track{flex:1;height:6px;background:var(--panel-2);border-radius:999px;overflow:hidden}
  .progress .fill{height:100%;background:var(--me);width:0;transition:width .2s}
  .bulk-sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
  .bulk-sum .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
  .bulk-sum .pill.ok{border-color:rgba(55,214,122,.45);color:#37d67a}
  .bulk-sum .pill.warn{border-color:rgba(224,169,74,.45);color:#e0a94a}
  .bulk-sum .pill.bad{border-color:var(--bad);color:var(--bad)}
  .bulk .status:empty{display:none}
  .bulk .row{margin-bottom:0}
  details.bulk-list{margin:6px 0;font-size:13px}
  details.bulk-list summary{cursor:pointer;color:var(--muted)}
  details.bulk-list ul{margin:6px 0 0 18px;padding:0}
</style>
</head>
<body>
  <div class="bar"><b>Admin</b><span class="muted" id="who"></span><span class="spacer"></span>
    <a href="/onboarding/admin/" target="_blank" rel="noopener"><button>Guide</button></a>
    <a href="/instructor"><button>Instructor</button></a>
    <button id="out">Sign out</button></div>
  <div class="shell">
    <nav class="side">
      <div class="nav active" data-v="overview">Overview</div>
      <div class="nav" data-v="users">Users</div>
      <div class="nav" data-v="cohorts">Cohorts</div>
      <div class="nav" data-v="sessions">Sessions</div>
      <div class="nav" data-v="scenarios">Scenarios</div>
      <div class="nav" data-v="audit">Audit</div>
      <div class="nav" data-v="settings">Settings</div>
    </nav>
    <div class="content" id="content">
      <div class="suspense" aria-busy="true" aria-live="polite">
        <div class="spin-lg" aria-hidden="true"></div>
        <p class="muted">Checking your account…</p>
      </div>
    </div>
  </div>
<script src="/static/auth.js"></script>
<script src="/static/viz.js"></script>
<link rel="stylesheet" href="/static/vendor/codemirror/codemirror.min.css"/>
<script src="/static/vendor/codemirror/codemirror.min.js"></script>
<script src="/static/vendor/codemirror/mode/yaml.min.js"></script>
<script src="/static/vendor/codemirror/addon/active-line.min.js"></script>
<script src="/static/editor.js"></script>
<script>
const h = () => SimAuth.headers({"Content-Type":"application/json"});
const el = id => document.getElementById(id);
const state = {uSort:"name", uDir:"asc", cSort:"name", cDir:"asc", cohortId:""};
let loadGen = 0;
const titles = {
  overview: "Overview", users: "Users", cohorts: "Cohorts", sessions: "All sessions",
  scenarios: "Scenarios", settings: "Settings", audit: "Audit log",
};
const esc = s => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// ---- shared dashboard bits (state chips, relative time) ----
const STATE_LABEL = {reviewed:"✓ reviewed", graded:"graded", submitted:"submitted", active:"in progress", not_started:"not started"};
const STATE_COLOR = {reviewed:"#9085e9", graded:"#9085e9", submitted:"#199e70", active:"#3987e5", not_started:"#c98500"};
function stateChip(st, total){ const k = STATE_LABEL[st] ? st : "not_started"; const pct = ((k==="graded"||k==="reviewed") && typeof total==="number") ? ` · ${Math.round(total*100)}%` : ""; return `<span class="st" style="color:${STATE_COLOR[k]};border-color:${STATE_COLOR[k]}">${STATE_LABEL[k]}${pct}</span>`; }
function keyChips(u){
  const g = u.has_groq_key, gh = u.has_github_token;
  return `<span class="kc ${g?"on":""}" title="${g?"Personal Groq key saved":"No personal Groq key"}">Groq</span><span class="kc ${gh?"on":""}" title="${gh?"Personal GitHub token saved":"No personal GitHub token"}">GitHub</span>`;
}
function ago(ts){
  if(!ts) return "—";
  const d = new Date(ts); if (isNaN(d)) return String(ts).slice(0,16);
  const s = (Date.now() - d.getTime())/1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60)+" min ago";
  if (s < 86400) return Math.floor(s/3600)+" h ago"; if (s < 7*86400) return Math.floor(s/86400)+" d ago";
  return d.toLocaleDateString();
}
function scenarioBars(stats){
  return SimViz.hbars(stats.by_scenario.map(b=>({label:b.title, sub:b.key, value:b.total, parts:[
    {value:(b.graded||0)+(b.reviewed||0), color:STATE_COLOR.graded, label:"graded"},
    {value:b.submitted, color:STATE_COLOR.submitted, label:"submitted"},
    {value:b.active, color:STATE_COLOR.active, label:"in progress"},
    {value:b.not_started, color:STATE_COLOR.not_started, label:"not started"}]})), {empty:"No sessions yet."})
    + SimViz.legend([{label:"graded",color:STATE_COLOR.graded},{label:"submitted",color:STATE_COLOR.submitted},{label:"in progress",color:STATE_COLOR.active},{label:"not started",color:STATE_COLOR.not_started}]);
}
function levelBars(stats){
  const lv = stats.by_level.filter(l=>l.count);
  return SimViz.hbars(lv.map(l=>({label:l.level, value:l.count})), {empty:"No sessions yet."});
}

function sortHead(cols, cur, dir){
  return cols.map(([k,label]) => {
    const mark = cur===k ? (dir==="desc" ? " ↓" : " ↑") : "";
    return `<th class="sort" data-sort="${k}">${label}${mark}</th>`;
  }).join("");
}
function errText(d, r, fallback){
  return (d && (d.error || (typeof d.detail === "string" ? d.detail : ""))) || fallback || ("Failed ("+(r&&r.status||"?")+")");
}
function setBusy(btn, on, labelId, idle, working){
  if (!btn) return;
  btn.disabled = !!on;
  btn.classList.toggle("busy", !!on);
  const lab = labelId ? el(labelId) : null;
  if (lab) lab.textContent = on ? working : idle;
}
function beginLoad(title, msg){
  const gen = ++loadGen;
  el("content").innerHTML =
    `<div class="suspense" aria-busy="true" aria-live="polite">
       <div class="spin-lg" aria-hidden="true"></div>
       <p class="muted">${esc(msg)}</p>
     </div>`;
  return gen;
}
function still(gen){ return gen === loadGen; }
function failPane(title, err, retry){
  el("content").innerHTML =
    `<h1>${esc(title)}</h1>
     <p class="status err">${esc(err)}</p>
     <button class="primary" type="button" id="retry">Try again</button>`;
  el("retry").onclick = retry;
}
const cache = new Map();
const CACHE_MS = 45000;
function peek(url){
  const hit = cache.get(url);
  return hit && (Date.now() - hit.at) < CACHE_MS ? hit.data : null;
}
function peekAll(urls){ return urls.every(u => peek(u)); }
function bustAdmin(){ cache.clear(); }
function viewUrls(v){
  if (v==="overview") return ["/api/admin/overview"];
  if (v==="users") return [
    `/api/admin/users?sort=${state.uSort}&direction=${state.uDir}`,
    "/api/admin/cohorts?sort=name&direction=asc",
  ];
  if (v==="cohorts") return state.cohortId
    ? ["/api/admin/cohorts/"+state.cohortId, "/api/admin/users?sort=name&direction=asc"]
    : [`/api/admin/cohorts?sort=${state.cSort}&direction=${state.cDir}`];
  if (v==="sessions") return ["/api/admin/sessions"];
  if (v==="scenarios") return ["/api/admin/scenarios"];
  if (v==="audit") return ["/api/admin/audit?limit=300"];
  if (v==="settings") return ["/api/admin/settings"];
  return [];
}
async function loadJson(url, fresh){
  if (!fresh) {
    const hit = peek(url);
    if (hit) return hit;
  }
  const r = await fetch(url, {headers: h()});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errText(d, r, "Could not load."));
  cache.set(url, {at: Date.now(), data: d});
  return d;
}
function toggleSort(which, key){
  if (which==="u") {
    if (state.uSort===key) state.uDir = state.uDir==="asc"?"desc":"asc";
    else { state.uSort=key; state.uDir="asc"; }
  } else {
    if (state.cSort===key) state.cDir = state.cDir==="asc"?"desc":"asc";
    else { state.cSort=key; state.cDir="asc"; }
  }
}
(async function(){
  try {
    const cfg = await SimAuth.config();
    if (cfg.auth_mode === "password") { el("content").innerHTML = "<p>Admin dashboard is for AUTH_MODE=firebase or fake.</p>"; return; }
    if (!SimAuth.requireToken("/admin")) return;
    const me = await SimAuth.me();
    if (!me || me.role !== "admin") { location.href = "/login?next=/admin"; return; }
    el("who").textContent = me.email;
    el("out").onclick = () => SimAuth.signOut();
    document.querySelectorAll(".nav").forEach(n => n.onclick = () => {
      document.querySelectorAll(".nav").forEach(x => x.classList.toggle("active", x===n));
      if (n.dataset.v === "cohorts") state.cohortId = "";
      show(n.dataset.v);
    });
    show("overview");
  } catch (e) {
    failPane("Admin", e.message || "Could not reach the server.", () => location.reload());
  }
})();

async function renderArchives(){
  const box = el("as-archives"); if (!box) return;
  let d; try { d = await (await fetch("/api/admin/archives",{headers:h()})).json(); } catch (e) { return; }
  const rows = d.archives || [];
  if (!rows.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<h2 style="font-size:16px;margin:0 0 6px">Archived sessions</h2><p class="muted">Deleted from the live store; the markdown audit is kept.</p>
    <table class="rtable"><thead><tr><th>Session</th><th>Scenario</th><th>Challenger</th><th>State</th><th>Archived</th><th></th></tr></thead><tbody>${
      rows.map(a => `<tr><td class="id">${esc(a.session_id)}</td><td>${esc(a.title||a.scenario)}</td><td>${esc(a.assignee)||"—"}</td><td>${stateChip(a.state)}</td><td class="muted">${ago(a.ts)}</td><td><a href="/api/admin/archives/${esc(a.session_id)}.md" target="_blank" rel="noopener"><button>Download</button></a></td></tr>`).join("")}</tbody></table>`;
}
let archiveTimer = null;
async function archivePanel(){
  const p = el("as-archive-panel"); p.hidden = false;
  p.innerHTML = `<h3>Archive finished sessions</h3><div class="sub">Keeps each session's markdown audit, then deletes the session, transcript, files, grade and review. Preview first.</div>
    <div class="row"><label class="muted">Older than <input id="ar-days" type="number" min="0" value="30" style="width:70px"/> days</label>
      <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ar-graded" checked/> graded</label>
      <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ar-reviewed" checked/> reviewed</label>
      <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ar-submitted"/> submitted (ungraded)</label>
      <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ar-idle"/> never started</label>
      <button id="ar-preview">Preview</button><button class="danger" id="ar-go" disabled>Archive</button><button id="ar-close">Close</button></div>
    <div id="ar-out" class="muted" style="margin-top:8px"></div>`;
  const states = () => [["graded","ar-graded"],["reviewed","ar-reviewed"],["submitted","ar-submitted"],["not_started","ar-idle"]].filter(([,id]) => el(id).checked).map(([s]) => s);
  const body = dry => ({older_than_days: +el("ar-days").value || 0, states: states(), dry_run: dry});
  el("ar-close").onclick = () => { p.hidden = true; clearTimeout(archiveTimer); };
  el("ar-preview").onclick = async () => {
    const r = await fetch("/api/admin/sessions/archive",{method:"POST",headers:h(),body:JSON.stringify(body(true))});
    const d = await r.json().catch(()=>({}));
    if (!r.ok) { el("ar-out").textContent = errText(d, r); return; }
    el("ar-out").innerHTML = d.count ? `<b>${d.count}</b> session${d.count===1?"":"s"} would be archived: ${d.sessions.slice(0,12).map(s=>esc(s.session_id)).join(", ")}${d.count>12?" …":""}` : "Nothing matches.";
    el("ar-go").disabled = !d.count;
  };
  el("ar-go").onclick = async () => {
    if (!confirm("Archive these sessions? Their live data is deleted; the markdown audit is kept.")) return;
    const r = await fetch("/api/admin/sessions/archive",{method:"POST",headers:h(),body:JSON.stringify(body(false))});
    const d = await r.json().catch(()=>({}));
    if (!r.ok) { el("ar-out").textContent = errText(d, r); return; }
    el("ar-go").disabled = true;
    const poll = async () => {
      const s = await (await fetch("/api/admin/sessions/archive",{headers:h()})).json();
      const j = s.job || {};
      el("ar-out").innerHTML = `<div class="progress"><div class="track"><i style="display:block;height:100%;background:var(--me);width:${j.total?Math.round(j.done/j.total*100):100}%"></i></div><span>${j.done||0} / ${j.total||0}${j.failed&&j.failed.length?` · ${j.failed.length} failed`:""}</span></div>`;
      if (j.status === "running") archiveTimer = setTimeout(poll, 1500);
      else { bustAdmin(); renderArchives(); show("sessions"); }
    };
    poll();
  };
}
// ---- scenario authoring ----
let scEd = null;
async function openScenarioEditor(key, scenarios){
  const panel = el("sc-editor"); panel.hidden = false;
  panel.innerHTML = `<div class="muted">Loading ${esc(key)}…</div>`;
  const d = await (await fetch(`/api/admin/scenarios/${encodeURIComponent(key)}/yaml`,{headers:h()})).json();
  if (d.error) { panel.innerHTML = `<div class="status err">${esc(d.error)}</div>`; return; }
  panel.innerHTML = `<div class="row" style="margin:0 0 8px"><h3 style="margin:0">${esc(key)}</h3>
      <span class="muted">${d.source === "override" ? `customised${d.author ? " by " + esc(d.author) : ""}${d.ts ? " · " + ago(d.ts) : ""}${d.based_on ? " · starter from " + esc(d.based_on) : ""}` : "from the file on disk"}</span>
      <span class="spacer"></span>
      <button id="sc-validate">Validate</button><button class="primary" id="sc-save"><span class="spin"></span>Save</button>
      ${d.source === "override" ? `<button class="danger" id="sc-revert">${d.on_disk ? "Revert to file" : "Delete scenario"}</button>` : ""}
      <button id="sc-close">Close</button></div>
    <div id="sc-host" style="position:relative;height:460px;border:1px solid var(--line);border-radius:10px;overflow:hidden"></div>
    <p class="status" id="sc-status" style="margin-top:8px"></p>`;
  if (scEd) { try { scEd.destroy(); } catch (e) {} }
  scEd = SimEditor.mount(el("sc-host"), { path: key + ".yaml", text: d.yaml, onSave: () => el("sc-save").click() });
  const status = el("sc-status");
  const send = async (validate) => {
    status.className = "status"; status.textContent = validate ? "Validating…" : "Saving…";
    const r = await fetch(`/api/admin/scenarios/${encodeURIComponent(key)}/yaml${validate ? "?validate=1" : ""}`,
      {method:"PUT",headers:h(),body:JSON.stringify({yaml: scEd.getValue()})});
    const dd = await r.json().catch(()=>({}));
    if (!r.ok) { status.className = "status err"; status.textContent = errText(dd, r); return; }
    status.textContent = validate
      ? `Valid: ${esc(dd.title)} (${esc(dd.track)}) · personas ${dd.personas.join(", ")} · rubric ${dd.criteria.join(", ")}`
      : `Saved. New sessions on ${esc(key)} use this version.`;
    if (!validate) { bustAdmin(); }
  };
  el("sc-validate").onclick = () => send(true);
  el("sc-save").onclick = () => send(false);
  el("sc-close").onclick = () => { panel.hidden = true; if (scEd) { scEd.destroy(); scEd = null; } };
  const rev = el("sc-revert");
  if (rev) rev.onclick = async () => {
    if (!confirm(d.on_disk ? "Discard your edits and go back to the file on disk?" : "Delete this scenario? Existing sessions keep running on it until the server restarts.")) return;
    const r = await fetch(`/api/admin/scenarios/${encodeURIComponent(key)}/yaml`,{method:"DELETE",headers:h()});
    if (!r.ok) { status.className = "status err"; status.textContent = "Could not revert."; return; }
    bustAdmin(); show("scenarios");
  };
}
function newScenarioPanel(scenarios){
  const p = el("sc-new-panel"); p.hidden = false;
  p.innerHTML = `<h3>New scenario from a template</h3><div class="sub">Copies the template's YAML under a new key and title, borrowing its starter folder. Then edit the personas, reveal ladder and rubric.</div>
    <div class="row">
      <label class="fld">Template<select id="sn-base">${scenarios.map(s=>`<option value="${esc(s.key)}">${esc(s.title)} (${esc(s.key)})</option>`).join("")}</select></label>

async function renderCalibration(){
  const box = el("cal-panel"); if (!box) return;
  let d;
  try { d = await (await fetch("/api/admin/calibration",{headers:h()})).json(); } catch (e) { box.innerHTML = `<div class="muted">Could not load calibration.</div>`; return; }
  const run = d.latest, th = d.thresholds || {};
  const pct = x => (x==null ? "—" : Math.round(x*100) + "%");
  let last = `<div class="muted">Never run.</div>`;
  if (run) {
    const groups = Object.entries(run.reports||{});
    const summary = run.status === "running"
      ? `<div class="prog"><div class="lab"><span>Grading reviewed sessions…</span><b>${run.done} / ${run.total}</b></div><div class="bar busy"><i style="width:${run.total?Math.round(run.done/run.total*100):0}%"></i></div></div>`
      : run.status === "failed" ? `<div class="status err">Last run failed: ${esc(run.error)}</div>`
      : `<div><b style="color:${run.passed?"#37d67a":"#e0655c"}">${run.passed?"PASS":"FAIL"}</b> <span class="muted">· ${run.total} fixture${run.total===1?"":"s"} · ${esc(run.provider)}${run.model?" · "+esc(run.model):""} · ${ago(run.finished||run.started)}${run.started_by?" · by "+esc(run.started_by):""}</span></div>`;
    const tables = groups.map(([label, r]) => `
      <div style="margin-top:10px"><div class="muted" style="font-size:12px">${esc(label)} — ${r.n} fixture${r.n===1?"":"s"} · ${r.passed?"pass":"fail"}</div>
      <table class="rtable" style="margin-top:4px"><tbody>
        <tr><td>Total error (MAE)</td><td>${pct(r.total_mae)} <span class="muted">≤ ${pct(th.max_total_mae)}</span></td></tr>
        <tr><td>Bias (model − human)</td><td>${r.total_bias>0?"+":""}${pct(r.total_bias)}</td></tr>
        <tr><td>Within ±${pct(th.tolerance)}</td><td>${pct(r.within_tolerance_rate)} <span class="muted">≥ ${pct(th.min_within_tolerance)}</span></td></tr>
        <tr><td>Rank correlation</td><td>${r.rank_correlation==null?"n/a":r.rank_correlation.toFixed(2)} <span class="muted">≥ ${th.min_rank_correlation}</span></td></tr>
      </tbody></table>
      ${SimViz.hbars((r.per_criterion||[]).map(c=>({label:c.key, value:Math.round(c.mae*100), sub:`bias ${c.bias>0?"+":""}${Math.round(c.bias*100)}`})), {empty:""})}
      ${(r.notes||[]).map(n=>`<div class="muted" style="font-size:12px;margin-top:4px">! ${esc(n)}</div>`).join("")}</div>`).join("");
    last = summary + tables;
  }
  box.innerHTML = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:13px">Calibration</b><span class="muted">${d.fixtures_available} reviewed session${d.fixtures_available===1?"":"s"} available as fixtures</span></div>
    <div style="margin-top:8px">${last}</div>
    <div class="row" style="margin-top:10px">
      <button id="cal-run" ${(!d.can_run || d.running || !d.fixtures_available) ? "disabled" : ""}><span class="spin"></span>Run calibration</button>
      <button class="primary" id="cal-apply" ${(run && run.status==="done" && run.passed && !d.calibrated) ? "" : "disabled"}>Mark grader calibrated</button>
      <a href="/api/admin/calibration/fixtures.json" target="_blank" rel="noopener" class="muted" style="font-size:12px">fixtures.json</a>
      <span class="status" id="cal-status"></span></div>
    ${!d.can_run ? `<div class="muted" style="font-size:12px">This server runs the fake model; calibration needs a real provider.</div>` : ""}`;
  el("cal-run").onclick = async () => {
    const r = await fetch("/api/admin/calibration/run",{method:"POST",headers:h()});
    const dd = await r.json().catch(()=>({}));
    if (!r.ok) { el("cal-status").className = "status err"; el("cal-status").textContent = errText(dd, r); return; }
    renderCalibration();
  };
  el("cal-apply").onclick = async () => {
    const r = await fetch("/api/admin/calibration/apply",{method:"POST",headers:h()});
    const dd = await r.json().catch(()=>({}));
    el("cal-status").className = "status" + (r.ok ? "" : " err");
    el("cal-status").textContent = r.ok ? "Grader marked calibrated; the caveat is gone." : errText(dd, r);

}

// ---- bulk add people (Users page and each cohort page) ----
const EMAIL_RE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g;
function countPeople(text){
  const seen = new Set();
  (text||"").split(/\r?\n/).forEach(l => (l.match(EMAIL_RE)||[]).forEach(e => seen.add(e.toLowerCase())));
  return seen.size;
}
function bulkPanel(host, opts){
  const key = opts.key;
  const coSel = opts.cohorts ? `<select id="bk-co"><option value="">no cohort</option>${opts.cohorts.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>` : "";
  host.hidden = false;
  const nameRow = opts.createCohort ? `<div class="row" style="margin-top:0">
      <input id="bk-name" placeholder="cohort name"/>
      <input id="bk-notes" placeholder="notes (optional)" style="flex:1"/>
    </div>` : "";
  host.innerHTML = `<div class="editor-card bulk">
    <div class="head"><b>${opts.createCohort ? "New cohort from a pasted list" : "Bulk add people"}</b><span class="muted">${opts.createCohort ? "Name the cohort, then paste" : "Paste"} one person per line: an email, <code>Name &lt;email&gt;</code>, or a row copied from a spreadsheet. Existing accounts are reused${opts.cohortId || opts.createCohort ? " and added to the cohort" : ""}.</span></div>
    ${nameRow}
    <textarea id="bk-text" rows="7" placeholder="amy@school.edu&#10;Ben Okoro <ben@school.edu>&#10;Cara Diaz, cara@school.edu"></textarea>
    <div class="row">${coSel}
      <select id="bk-role"><option value="challenger">challenger</option><option value="instructor">instructor</option></select>
      <label class="chk"><input type="checkbox" id="bk-reset" checked/> Email each new account a set-password link</label>
      <span class="spacer"></span>
      <button class="primary" id="bk-go" disabled><span class="spin"></span><span id="bk-go-label">Add people</span></button>
    </div>
    <div class="progress" id="bk-prog" hidden><div class="track"><div class="fill" id="bk-fill"></div></div><span class="muted" id="bk-count"></span></div>
    <p class="status muted" id="bk-status"></p>
    <div id="bk-result"></div>
  </div>`;
  const ta = el("bk-text"), go = el("bk-go"), lab = el("bk-go-label");
  const verb = opts.createCohort ? "Create cohort & add" : "Add";
  lab.textContent = `${verb} people`;
  const refresh = () => {
    const n = countPeople(ta.value);
    lab.textContent = n ? `${verb} ${n} ${n === 1 ? "person" : "people"}` : `${verb} people`;
    go.disabled = !n || (opts.createCohort && !el("bk-name").value.trim());
  };
  ta.addEventListener("input", refresh);
  if (opts.createCohort) el("bk-name").addEventListener("input", refresh);
  if (state.bulk && state.bulk.key === key) renderBulkResult(state.bulk.result);
  go.onclick = async () => {
    const lines = ta.value.split(/\r?\n/).filter(l => l.trim());
    const total = countPeople(ta.value);
    const body = { role: el("bk-role").value, send_reset: el("bk-reset").checked,
                   cohort_id: opts.cohortId || (el("bk-co") ? el("bk-co").value : "") };
    const sum = { created:[], existing:[], failed:[], invalid:[], cohort:null };
    go.disabled = true; go.classList.add("busy"); ta.disabled = true;
    el("bk-prog").hidden = false; el("bk-fill").style.width = "0%"; el("bk-result").innerHTML = "";
    el("bk-status").className = "status muted";
    let done = 0;
    try {
      if (opts.createCohort) {
        el("bk-status").textContent = "Creating the cohort…";
        const cr = await fetch("/api/admin/cohorts", {method:"POST", headers:h(),
          body: JSON.stringify({name: el("bk-name").value.trim(), notes: el("bk-notes").value.trim()})});
        const cd = await cr.json().catch(() => ({}));
        if (!cr.ok) { el("bk-status").className = "status err"; el("bk-status").textContent = errText(cd, cr, "Could not create that cohort."); return; }
        body.cohort_id = cd.id;
      }
      el("bk-status").textContent = body.send_reset ? "Creating accounts and sending set-password emails…" : "Creating accounts…";
      for (let i = 0; i < lines.length; i += 10) {
        const chunk = lines.slice(i, i + 10);
        const r = await fetch("/api/admin/users/bulk", {method:"POST", headers:h(), body: JSON.stringify({...body, text: chunk.join("\n")})});
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { el("bk-status").className = "status err"; el("bk-status").textContent = errText(d, r, "Bulk add failed."); return; }
        ["created","existing","failed","invalid"].forEach(k => sum[k].push(...(d[k]||[])));
        sum.cohort = d.cohort || sum.cohort;
        done += chunk.length;
        el("bk-fill").style.width = Math.round(100 * done / lines.length) + "%";
        el("bk-count").textContent = `${Math.min(sum.created.length + sum.existing.length + sum.failed.length, total)} / ${total}`;
      }
      if (opts.createCohort && body.cohort_id) {
        state.cohortId = body.cohort_id;
        state.bulk = { key: "cohort:" + body.cohort_id, result: sum };
      } else {
        state.bulk = { key, result: sum };
      }
      bustAdmin();
      await show(opts.view);
    } catch (e) {
      el("bk-status").className = "status err";
      el("bk-status").textContent = "Network error. People already processed were saved; paste the rest and try again.";
    } finally {
      if (el("bk-go")) { go.disabled = false; go.classList.remove("busy"); ta.disabled = false; }
    }
  };
}
function renderBulkResult(r){
  const box = el("bk-result"); if (!box) return;
  const who = u => esc(u.name ? `${u.name} <${u.email}>` : u.email);
  const list = (title, items, fmt, open) => items.length
    ? `<details class="bulk-list"${open ? " open" : ""}><summary>${title} (${items.length})</summary><ul>${items.map(fmt).join("")}</ul></details>` : "";
  box.innerHTML = `
    <div class="bulk-sum">
      <span class="pill ok">Created ${r.created.length}</span>
      <span class="pill">Already had an account ${r.existing.length}</span>
      ${r.failed.length ? `<span class="pill bad">Could not create ${r.failed.length}</span>` : ""}
      ${r.invalid.length ? `<span class="pill warn">Not an email ${r.invalid.length}</span>` : ""}
      ${r.cohort ? `<span class="pill">added to ${esc(r.cohort.name)}</span>` : ""}
      <span class="spacer"></span><button id="bk-clear">Clear</button>
    </div>
    ${list("Created", r.created, u => `<li>${who(u)}</li>`)}
    ${list("Already had an account", r.existing, u => `<li>${who(u)} · ${esc(u.role)}</li>`)}
    ${list("Could not create", r.failed, u => `<li>${who(u)} — ${esc(u.reason)}</li>`, true)}
    ${list("Not an email", r.invalid, l => `<li>${esc(l)}</li>`, true)}`;
  el("bk-clear").onclick = () => { state.bulk = null; box.innerHTML = ""; };
}

    status.textContent = "Saving…";
    try {
      const r = await fetch("/api/admin/cohorts/"+cid,{method:"PATCH",headers:h(),
        body:JSON.stringify({name:el("co-name").value.trim(), notes:el("co-notes").value.trim()})});
      const d = await r.json().catch(()=>({}));
      if (!r.ok) { status.className="status err"; status.textContent=errText(d,r,"Save failed."); return; }
      bustAdmin();
      await show("cohorts");
    } finally {
      setBusy(el("co-save"), false, "co-save-label", "Save", "Saving…");
    }
  };
  bulkPanel(el("bk-host"), {key:"cohort:"+cid, view:"cohorts", cohortId:cid});
  el("add-m").onclick = async () => {
    const uid = el("add-uid").value;
    if (!uid) return;
    setBusy(el("add-m"), true, "add-m-label", "Add", "Adding…");
    el("add-uid").disabled = true;
    try {
      await fetch("/api/admin/cohorts/"+cid+"/members",{method:"POST",headers:h(),body:JSON.stringify({uid})});
      bustAdmin();
      await show("cohorts");
    } finally {
      setBusy(el("add-m"), false, "add-m-label", "Add", "Adding…");
      if (el("add-uid")) el("add-uid").disabled = false;
    }
  };
  c.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    b.textContent = "Removing…";
    await fetch("/api/admin/cohorts/"+cid+"/members/"+b.dataset.rm,{method:"DELETE",headers:h()});
    bustAdmin();
    show("cohorts");
  });
}
</script>
</body>
</html>
