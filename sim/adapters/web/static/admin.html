<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin</title>
<style>
  :root{
    --ink:#0f1217; --panel:#161b23; --panel-2:#1b212b; --line:#272e3a;
    --text:#e7eaf0; --muted:#8a93a4; --me:#3b6ef5; --bad:#e0655c;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--ui);background:var(--ink);color:var(--text);height:100vh;display:flex;flex-direction:column}
  .bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar .spacer{flex:1}
  .shell{flex:1;display:flex;min-height:0}
  .side{width:200px;border-right:1px solid var(--line);padding:12px 10px}
  .nav{padding:10px 12px;border-radius:9px;cursor:pointer}
  .nav:hover,.nav.active{background:var(--panel-2)}
  .content{flex:1;overflow:auto;padding:24px 28px}
  .muted{color:var(--muted);font-size:13px}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit}
  button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 13px;cursor:pointer;font:inherit;font-size:13px}
  button.primary{background:var(--me);border-color:var(--me);color:#fff;font-weight:600}
  button.danger{border-color:var(--bad);color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>
  <div class="bar"><b>Admin</b><span class="muted" id="who"></span><span class="spacer"></span>
    <a href="/instructor"><button>Instructor</button></a>
    <button id="out">Sign out</button></div>
  <div class="shell">
    <nav class="side">
      <div class="nav active" data-v="users">Users</div>
      <div class="nav" data-v="sessions">Sessions</div>
      <div class="nav" data-v="scenarios">Scenarios</div>
      <div class="nav" data-v="settings">Settings</div>
    </nav>
    <div class="content" id="content"></div>
  </div>
<script src="/static/auth.js"></script>
<script>
const h = () => SimAuth.headers({"Content-Type":"application/json"});
const el = id => document.getElementById(id);
(async function(){
  const cfg = await SimAuth.config();
  if (cfg.auth_mode === "password") { el("content").innerHTML = "<p>Admin dashboard is for AUTH_MODE=firebase or fake.</p>"; return; }
  if (!SimAuth.requireToken("/admin")) return;
  const me = await SimAuth.me();
  if (!me || me.role !== "admin") { location.href = "/login?next=/admin"; return; }
  el("who").textContent = me.email;
  el("out").onclick = () => SimAuth.signOut();
  document.querySelectorAll(".nav").forEach(n => n.onclick = () => {
    document.querySelectorAll(".nav").forEach(x => x.classList.toggle("active", x===n));
    show(n.dataset.v);
  });
  show("users");
})();

async function show(v){
  const c = el("content");
  if (v==="users") {
    const d = await (await fetch("/api/admin/users",{headers:h()})).json();
    c.innerHTML = `<h1>Users</h1>
      <div class="row">
        <input id="nu-email" placeholder="email"/>
        <select id="nu-role"><option>challenger</option><option>instructor</option><option>admin</option></select>
        <button class="primary" id="nu">Create</button>
      </div>
      <table><thead><tr><th>Email</th><th>Role</th><th>Disabled</th><th></th></tr></thead>
      <tbody>${(d.users||[]).map(u=>`<tr>
        <td>${u.email}<div class="muted">${u.uid}</div></td>
        <td><select data-role="${u.uid}">${["challenger","instructor","admin"].map(r=>`<option ${r===u.role?"selected":""}>${r}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-dis="${u.uid}" ${u.disabled?"checked":""}/></td>
        <td><button data-del="${u.uid}" class="danger">Delete</button></td>
      </tr>`).join("")}</tbody></table>`;
    el("nu").onclick = async () => {
      await fetch("/api/admin/users",{method:"POST",headers:h(),body:JSON.stringify({email:el("nu-email").value,role:el("nu-role").value,send_reset:true})});
      show("users");
    };
    c.querySelectorAll("[data-role]").forEach(s => s.onchange = async () => {
      await fetch("/api/admin/users/"+s.dataset.role,{method:"PATCH",headers:h(),body:JSON.stringify({role:s.value})});
    });
    c.querySelectorAll("[data-dis]").forEach(s => s.onchange = async () => {
      await fetch("/api/admin/users/"+s.dataset.dis,{method:"PATCH",headers:h(),body:JSON.stringify({disabled:s.checked})});
    });
    c.querySelectorAll("[data-del]").forEach(s => s.onclick = async () => {
      if (!confirm("Delete user?")) return;
      await fetch("/api/admin/users/"+s.dataset.del,{method:"DELETE",headers:h()});
      show("users");
    });
  }
  if (v==="sessions") {
    const d = await (await fetch("/api/admin/sessions",{headers:h()})).json();
    c.innerHTML = `<h1>All sessions</h1>
      <table><thead><tr><th>Id</th><th>Scenario</th><th>Owner</th><th>Assignee</th><th></th></tr></thead>
      <tbody>${(d.sessions||[]).map(s=>`<tr>
        <td class="muted">${s.session_id}</td><td>${s.scenario}</td>
        <td>${s.owner_uid}</td><td>${s.assignee_uid}</td>
        <td><a href="/instructor"><button>Replay via instructor</button></a>
            <button class="danger" data-ds="${s.session_id}">Delete</button></td>
      </tr>`).join("")}</tbody></table>`;
    c.querySelectorAll("[data-ds]").forEach(b => b.onclick = async () => {
      if (!confirm("Cascade delete session "+b.dataset.ds+"?")) return;
      await fetch("/api/admin/sessions/"+b.dataset.ds,{method:"DELETE",headers:h()});
      show("sessions");
    });
  }
  if (v==="scenarios") {
    const d = await (await fetch("/api/admin/scenarios",{headers:h()})).json();
    c.innerHTML = `<h1>Scenarios</h1>
      ${(d.scenarios||[]).map(s=>`<div class="row" style="border-bottom:1px solid var(--line);padding:10px 0">
        <b style="min-width:220px">${s.title}</b>
        <label class="muted"><input type="checkbox" data-en="${s.key}" ${s.enabled?"checked":""}/> enabled</label>
        <input data-url="${s.key}" placeholder="starter URL" value="${s.starter_url||""}" style="flex:1"/>
        <button data-save="${s.key}">Save</button>
      </div>`).join("")}`;
    c.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
      const key = b.dataset.save;
      const url = c.querySelector(`[data-url="${key}"]`).value;
      const enabled = c.querySelector(`[data-en="${key}"]`).checked;
      await fetch("/api/admin/scenarios/"+key,{method:"PUT",headers:h(),body:JSON.stringify({starter_url:url,enabled})});
    });
  }
  if (v==="settings") {
    const s = await (await fetch("/api/admin/settings",{headers:h()})).json();
    const st = await (await fetch("/api/admin/auth/status",{headers:h()})).json();
    c.innerHTML = `<h1>Settings</h1>
      <p class="muted">Auth mode <b>${st.auth_mode}</b> · project ${st.firebase_project_id||"(none)"} · ${st.users_count} users</p>
      <div class="row"><label>Default level <input id="dl" value="${s.default_level}"/></label>
      <button class="primary" id="sv">Save</button></div>`;
    el("sv").onclick = async () => {
      await fetch("/api/admin/settings",{method:"PUT",headers:h(),body:JSON.stringify({onboarded:true,default_level:el("dl").value})});
    };
  }
}
</script>
</body>
</html>
