<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Instructor Dashboard</title>
<style>
  :root{
    --ink:#0f1217; --panel:#161b23; --panel-2:#1b212b; --line:#272e3a;
    --text:#e7eaf0; --muted:#8a93a4; --faint:#5c6575;
    --me:#3b6ef5; --them:#1f2632; --ok:#37d67a; --warn:#e0a94a; --bad:#e0655c;
    --chat:#3b6ef5; --mail:#caa24a; --ticket:#c56bff; --sig:#caa24a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--ui);background:var(--ink);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:#3a4353}
  button.primary{background:var(--me);border-color:var(--me);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  select,input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px;font:inherit;outline:none}
  select:focus,input:focus{border-color:var(--me)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
  .badge{font:11px/1 var(--mono);border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
  .hidden{display:none!important}

  .bar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar .brand{font-weight:600}
  .bar .brand .tag{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
  .bar .spacer{flex:1}

  .shell{flex:1;display:flex;min-height:0}
  .side{width:210px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:4px}
  .side .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text)}
  .side .nav:hover{background:var(--panel-2)}
  .side .nav.active{background:var(--panel-2)}
  .side .nav.active::before{content:"";width:3px;align-self:stretch;background:var(--me);border-radius:2px;margin:-10px 2px -10px -12px}
  .content{flex:1;min-width:0;overflow-y:auto;padding:24px 28px}
  .content h1{font-size:18px;margin:0 0 4px}
  .content .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;max-width:640px}
  .field{margin-bottom:14px}
  .match{font-size:13px;border-radius:9px;padding:9px 12px;margin:10px 0}
  .match.ok{background:rgba(55,214,122,.1);border:1px solid rgba(55,214,122,.3);color:var(--ok)}
  .match.warn{background:rgba(224,169,74,.1);border:1px solid rgba(224,169,74,.3);color:var(--warn)}
  .match.bad{background:rgba(224,101,92,.1);border:1px solid rgba(224,101,92,.3);color:var(--bad)}
  .linkbox{display:flex;gap:8px;margin-top:12px}
  .linkbox input{flex:1;font-family:var(--mono);font-size:12.5px}

  .srow{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
  .srow:hover{border-color:var(--me)}
  .srow .id{font-family:var(--mono);font-size:13px}
  .srow .tags{display:flex;gap:6px}
  .srow .meta{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}

  /* replay */
  #replay{display:flex;height:100%;gap:0}
  .replay-main{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  .replay-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .replay-head .back{cursor:pointer}
  .controls{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .controls .rowa{display:flex;align-items:center;gap:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted);user-select:none}
  .chip.on{color:var(--text);border-color:currentColor}
  .chip.chat.on{color:var(--chat)} .chip.mail.on{color:var(--mail)} .chip.ticket.on{color:var(--ticket)} .chip.sig.on{color:var(--sig)}
  .scrub{display:flex;align-items:center;gap:10px}
  .scrub input[type=range]{flex:1}
  .scrub .pos{font:12px/1 var(--mono);color:var(--muted);min-width:64px;text-align:right}
  .timeline{flex:1;overflow-y:auto;padding:14px 16px}
  .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
  .ev .rail{width:74px;flex:none;font:11px/1.4 var(--mono);color:var(--faint);text-align:right}
  .ev .rail .surface{display:block;font-weight:700}
  .ev.chat .surface{color:var(--chat)} .ev.mail .surface{color:var(--mail)} .ev.ticket .surface{color:var(--ticket)} .ev.sig .surface{color:var(--sig)}
  .ev .who{font-size:13px;font-weight:600}.ev .subj{font-size:12px;color:var(--muted)}
  .ev .txt{font-size:14px;word-wrap:break-word;margin-top:2px}
  .ev .txt.md{white-space:normal}
  .ev.sig .txt{font:12.5px/1.5 var(--mono);color:var(--sig)}
  .replay-side{width:330px;flex:none;overflow-y:auto}
  .replay-side .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .replay-side .head label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;margin:0}
  .replay-side .body{padding:16px}
  .grade .total{font-size:30px;font-weight:700}
  .grade .crit{margin-top:12px}.grade .crit .k{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
  .grade .crit .barx{height:6px;background:var(--panel-2);border-radius:4px;margin:5px 0;overflow:hidden}
  .grade .crit .barx i{display:block;height:100%;background:var(--me)}
  .grade .crit .evd{font-size:12px;color:var(--muted)}
  .grade .caveat{margin-top:12px;font:12px/1.5 var(--mono);color:var(--sig);background:rgba(202,162,74,.1);border:1px solid rgba(202,162,74,.28);border-radius:8px;padding:8px 10px}
  .muted{color:var(--muted);font-size:13px}

  /* overlays */
  .overlay{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:10}
  .overlay .box{width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
  .overlay h1{font-size:19px;margin:0}
  .overlay p{color:var(--muted);font-size:13px;margin:0}
  .overlay .err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>
  <!-- login -->
  <div class="overlay" id="login">
    <div class="box">
      <h1>Instructor access</h1>
      <p>Restricted. Enter the instructor password.</p>
      <input id="pw" type="password" placeholder="Password" autofocus/>
      <div class="err" id="loginerr"></div>
      <button class="primary" id="loginbtn">Enter</button>
    </div>
  </div>

  <!-- onboarding (first run) -->
  <div class="overlay hidden" id="onboard">
    <div class="box">
      <h1>Welcome — let's set you up</h1>
      <p>Pick the engineer level you'll most often run. You can change it any time, and set a different level per session.</p>
      <div style="text-align:left"><label>Default engineer level</label><select id="ob-level" style="width:100%"></select></div>
      <button class="primary" id="ob-save">Get started</button>
    </div>
  </div>

  <div class="bar">
    <span class="brand">Instructor Dashboard<span class="tag" id="scname"></span></span>
    <span class="spacer"></span>
  </div>
  <div class="shell hidden" id="shell">
    <nav class="side">
      <div class="nav active" data-view="new">New session</div>
      <div class="nav" data-view="sessions">Sessions</div>
      <div class="nav" data-view="settings">Settings</div>
    </nav>
    <div class="content" id="content"></div>
  </div>

<script src="/static/md.js"></script>
<script>
let token = "", settings = null;
let rows = [], filtered = [], meta = {personas:[], mail:{}}, idx = 0, playTimer = null, curSid = null;
const filters = {chat:true, mail:true, ticket:true, sig:true};
const el = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; };
const hdr = () => ({"X-Instructor-Token": token});
const fmt = ts => { const d=new Date(ts); return isNaN(d)?"":d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); };
const fmtDate = ts => { const d=new Date(ts); return isNaN(d)?"":d.toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
const rankOf = k => (settings.levels.findIndex(l=>l.key===k));
const levelLabel = k => (settings.levels.find(l=>l.key===k)||{}).label || k;

// ---- login + onboarding ----
async function login(){
  const pw = el("pw").value;
  const r = await (await fetch("/api/instructor/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})).json();
  if(!r.ok){ el("loginerr").textContent="Incorrect password."; return; }
  token = pw; el("login").classList.add("hidden");
  settings = await (await fetch("/api/instructor/settings",{headers:hdr()})).json();
  el("scname").textContent = "";
  if(!settings.onboarded){ showOnboarding(); } else { enterDashboard(); }
}
el("loginbtn").onclick = login;
el("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });

function showOnboarding(){
  const sel = el("ob-level"); sel.innerHTML = settings.levels.map(l=>`<option value="${l.key}">${l.label}</option>`).join("");
  sel.value = settings.default_level;
  el("onboard").classList.remove("hidden");
}
el("ob-save").onclick = async ()=>{
  const lvl = el("ob-level").value;
  await fetch("/api/instructor/settings",{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({onboarded:true,default_level:lvl})});
  settings.onboarded = true; settings.default_level = lvl;
  el("onboard").classList.add("hidden"); enterDashboard();
};

function enterDashboard(){ el("shell").classList.remove("hidden"); switchView("new"); }

// ---- nav ----
document.querySelectorAll(".side .nav").forEach(n=> n.onclick = ()=> switchView(n.dataset.view));
function switchView(v){
  document.querySelectorAll(".side .nav").forEach(n=> n.classList.toggle("active", n.dataset.view===v));
  if(v==="new") renderNew();
  else if(v==="sessions") renderSessions();
  else if(v==="settings") renderSettings();
}

// ---- new session ----
function renderNew(){
  const product = settings.scenarios.filter(s=>s.track!=="systems" && s.track!=="interview");
  const systems = settings.scenarios.filter(s=>s.track==="systems");
  const interview = settings.scenarios.filter(s=>s.track==="interview");
  const opt = s => `<option value="${s.key}" data-diff="${s.difficulty}">${s.title} — ${s.difficulty}</option>`;
  const groups = [];
  if (product.length) groups.push(`<optgroup label="Product engineering">${product.map(opt).join("")}</optgroup>`);
  if (systems.length) groups.push(`<optgroup label="Systems design">${systems.map(opt).join("")}</optgroup>`);
  if (interview.length) groups.push(`<optgroup label="Interview assessment">${interview.map(opt).join("")}</optgroup>`);
  const scOpts = groups.join("") || product.map(opt).join("");
  const lvOpts = settings.levels.map(l=>`<option value="${l.key}">${l.label}</option>`).join("");
  // sane default: a scenario whose difficulty matches the default level, else first
  const match = settings.scenarios.find(s=>s.difficulty===settings.default_level);
  el("content").innerHTML = `
    <h1>New session</h1>
    <p class="sub">Assign a scenario and engineer level, then hand the trainee the link.</p>
    <div class="card">
      <div class="field"><label>Scenario</label><select id="ns-sc" style="width:100%">${scOpts}</select></div>
      <div class="field"><label>Engineer level</label><select id="ns-lv" style="width:100%">${lvOpts}</select></div>
      <div id="ns-match" class="match"></div>
      <button class="primary" id="ns-create">Create session & get link</button>
      <div id="ns-result"></div>
    </div>`;
  const scSel = el("ns-sc"), lvSel = el("ns-lv");
  if(match) scSel.value = match.key;
  lvSel.value = settings.default_level;
  const upd = ()=>{
    const diff = scSel.selectedOptions[0].dataset.diff, lv = lvSel.value;
    const gap = rankOf(lv) - rankOf(diff);
    const m = el("ns-match");
    if(gap <= -2){ m.className="match bad"; m.textContent = `This scenario is pitched well above a ${levelLabel(lv)} — likely too hard.`; }
    else if(gap >= 2){ m.className="match warn"; m.textContent = `This scenario may be too easy for a ${levelLabel(lv)}.`; }
    else { m.className="match ok"; m.textContent = `Good match: a ${levelLabel(lv)} on a ${diff}-level scenario.`; }
  };
  scSel.onchange = upd; lvSel.onchange = upd; upd();
  el("ns-create").onclick = async ()=>{
    const sid = "s-" + Math.random().toString(36).slice(2,9);
    await fetch(`/api/instructor/session/${sid}/scenario`,{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({scenario:scSel.value})});
    await fetch(`/api/instructor/session/${sid}/level`,{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({level:lvSel.value})});
    const link = `${location.origin}/#${sid}`;
    el("ns-result").innerHTML = `
      <div class="match ok" style="margin-top:16px">Session created: <b>${sid}</b></div>
      <label style="margin-top:12px">Trainee link — send this to the engineer</label>
      <div class="linkbox"><input id="ns-link" readonly value="${link}"/><button id="ns-copy">Copy</button></div>
      <div style="margin-top:12px"><button id="ns-watch">Open replay for this session</button></div>`;
    el("ns-copy").onclick = ()=>{ navigator.clipboard.writeText(link); el("ns-copy").textContent="Copied"; };
    el("ns-watch").onclick = ()=> openReplay(sid);
  };
}

// ---- sessions ----
async function renderSessions(){
  el("content").innerHTML = `<h1>Sessions</h1><p class="sub">Recorded runs. Click to replay.</p><div id="slist"></div>`;
  const data = await (await fetch("/api/instructor/sessions",{headers:hdr()})).json();
  const box = el("slist");
  if(!data.sessions || !data.sessions.length){ box.innerHTML = `<div class="muted">No sessions recorded yet.</div>`; return; }
  box.innerHTML = "";
  data.sessions.forEach(s=>{
    const row = document.createElement("div"); row.className="srow";
    row.innerHTML = `<span class="id">${s.session_id}</span>
      <span class="tags"><span class="badge">${s.scenario||"—"}</span><span class="badge">${levelLabel(s.level)}</span></span>
      <span class="meta">${s.count} events<br/>${fmtDate(s.last_ts)}</span>`;
    row.onclick = ()=> openReplay(s.session_id);
    box.appendChild(row);
  });
}

// ---- replay ----
async function openReplay(sid){
  curSid = sid;
  const data = await (await fetch(`/api/instructor/session/${sid}`,{headers:hdr()})).json();
  meta = {personas:data.personas||[], mail:data.mail||{}};
  rows = (data.transcript||[]).filter(m=> !(m.kind==="event" && m.content.startsWith("[fired:")));
  el("content").innerHTML = `
    <div id="replay">
      <div class="replay-main">
        <div class="replay-head"><button class="back">← Sessions</button>
          <b>${sid}</b><span class="badge">${esc((data.scenario||{}).title||"")}</span>
          <span class="badge">${levelLabel(data.level)}</span></div>
        <div class="controls">
          <div class="rowa"><button id="play">▶ Play</button>
            <div class="chips" id="chips">
              <span class="chip chat on" data-f="chat">Chat</span>
              <span class="chip mail on" data-f="mail">Mail</span>
              <span class="chip ticket on" data-f="ticket">Tickets</span>
              <span class="chip sig on" data-f="sig">Signals</span></div></div>
          <div class="scrub"><input type="range" id="scrub" min="0" max="0" value="0"/><span class="pos" id="pos">0 / 0</span></div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="replay-side">
        <div class="head"><b>Assessment</b><span style="flex:1"></span>
          <label><input type="checkbox" id="includeTickets"/> Tickets extra credit</label>
          <button id="gradeBtn">Grade</button>
          <button id="exportBtn">Export</button></div>
        <div class="body" id="gradebody"><div class="muted">Grade the run to see the score and evidence.</div></div>
      </div>
    </div>`;
  el("content").querySelector(".back").onclick = ()=> switchView("sessions");
  wireReplay();
  applyFilter(); idx = filtered.length; syncScrub(); renderTimeline();
}
function surfaceOf(m){ return m.kind==="email"?"mail":m.kind==="ticket"?"ticket":m.kind==="event"?"sig":"chat"; }
function applyFilter(){ filtered = rows.filter(m=> filters[surfaceOf(m)]); }
function nameOf(k){ const p=meta.personas.find(x=>x.key===k); return p?p.name:(k==="tester"?"You":k); }
function renderTimeline(){
  const tl = el("timeline"); tl.innerHTML="";
  filtered.slice(0,idx).forEach(m=> tl.appendChild(renderEv(m)));
  tl.scrollTop = tl.scrollHeight; el("pos").textContent = `${idx} / ${filtered.length}`;
}
function renderEv(m){
  const s = surfaceOf(m), d = document.createElement("div"); d.className="ev "+s;
  const label = {chat:"CHAT",mail:"MAIL",ticket:"TICKET",sig:"SIGNAL"}[s];
  let who="", subj="";
  if(s==="chat") who=nameOf(m.sender);
  else if(s==="mail"){ who=nameOf(m.sender); const mm=meta.mail[m.channel]; subj=mm?("Re: "+mm.subject):""; }
  else if(s==="ticket") who="Tickets";
  d.innerHTML = `<div class="rail"><span class="surface">${label}</span>${fmt(m.ts)}</div>`+
    `<div><div class="who">${esc(who)}</div>${subj?`<div class="subj">${esc(subj)}</div>`:""}<div class="txt md">${window.SimMD?SimMD.render(m.content):esc(m.content)}</div></div>`;
  return d;
}
function syncScrub(){ const sc=el("scrub"); sc.max=filtered.length; sc.value=idx; el("pos").textContent=`${idx} / ${filtered.length}`; }
function wireReplay(){
  if (window.SimMD) SimMD.hydrate(el("timeline"));
  el("scrub").addEventListener("input", e=>{ idx=+e.target.value; renderTimeline(); });
  el("play").onclick = ()=>{
    if(playTimer){ stopPlay(); return; }
    if(idx>=filtered.length) idx=0;
    el("play").textContent="❚❚ Pause";
    playTimer = setInterval(()=>{ if(idx>=filtered.length){ stopPlay(); return; } idx++; el("scrub").value=idx; renderTimeline(); }, 650);
  };
  el("chips").addEventListener("click", e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    filters[c.dataset.f]=!filters[c.dataset.f]; c.classList.toggle("on",filters[c.dataset.f]);
    applyFilter(); idx=Math.min(idx,filtered.length); syncScrub(); renderTimeline();
  });
  el("gradeBtn").onclick = doGrade;
  el("exportBtn").onclick = doExport;
}
function stopPlay(){ clearInterval(playTimer); playTimer=null; const p=el("play"); if(p) p.textContent="▶ Play"; }
async function doGrade(){
  el("gradebody").innerHTML = `<div class="muted">Grading…</div>`;
  const includeTickets = !!(el("includeTickets") && el("includeTickets").checked);
  const g = await (await fetch(`/api/session/${curSid}/grade`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({include_tickets:includeTickets})})).json();
  if(g.error){ el("gradebody").innerHTML=`<div class="muted">Grade error: ${g.error}</div>`; return; }
  const scores = g.scores.slice();
  if (g.tickets_extra) scores.push({key:"tickets (extra credit)", score:g.tickets_extra.score, evidence:g.tickets_extra.evidence});
  const crits = scores.map(s=>`<div class="crit"><div class="k"><span>${s.key}</span><span>${(s.score*100|0)}%</span></div><div class="barx"><i style="width:${(s.score*100|0)}%"></i></div><div class="evd">${esc(s.evidence)}</div></div>`).join("");
  const caveat = g.calibrated ? "" : `<div class="caveat">${esc(g.caveat||"grader not calibrated")}</div>`;
  const extraNote = g.include_tickets ? ` · base ${(g.total_base*100|0)}% + tickets extra credit` : "";
  el("gradebody").innerHTML = `<div class="grade"><div class="total">${(g.total*100|0)}%</div><div class="muted">graded at ${levelLabel(g.level)} expectations${extraNote}</div>${crits}<div style="margin-top:12px">${esc(g.summary)}</div>${caveat}</div>`;
}
async function doExport(){
  const includeTickets = !!(el("includeTickets") && el("includeTickets").checked);
  const r = await fetch(`/api/instructor/session/${curSid}/export.md?include_tickets=${includeTickets? "true":"false"}`,{headers:hdr()});
  if(!r.ok){ el("gradebody").innerHTML=`<div class="muted">Export failed (${r.status})</div>`; return; }
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${curSid}-audit.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function wireStarterSaves(){
  document.querySelectorAll('.savestarter').forEach(b=> b.onclick = async ()=>{
    const key=b.dataset.key;
    const url=document.querySelector('.starter[data-key="'+key+'"]').value.trim();
    await fetch('/api/instructor/scenario/'+key+'/starter-url',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({url})});
    b.textContent='Saved'; setTimeout(()=>b.textContent='Save',1200);
    const sc=settings.scenarios.find(s=>s.key===key); if(sc) sc.starter_url=url;
  });
}

// ---- settings ----
function renderSettings(){
  const lvOpts = settings.levels.map(l=>`<option value="${l.key}">${l.label}</option>`).join("");
  const scList = settings.scenarios.map(s=>`<div class="srow" style="cursor:default;flex-wrap:wrap">
      <span class="id">${s.title}</span><span class="tags"><span class="badge">${s.track==="interview"?"Interview":s.track==="systems"?"Systems":"Product"}</span><span class="badge">${s.difficulty}</span></span>
      <div style="flex-basis:100%;display:flex;gap:8px;margin-top:8px">
        <input class="starter" data-key="${s.key}" placeholder="public GitHub starter repo URL (optional)" value="${s.starter_url||''}" style="flex:1;font-size:12px"/>
        <button class="savestarter" data-key="${s.key}">Save</button>
      </div></div>`).join("");
  el("content").innerHTML = `
    <h1>Settings</h1><p class="sub">Defaults and library.</p>
    <div class="card">
      <div class="field"><label>Default engineer level (used when a session has none set)</label>
        <select id="st-level" style="width:100%">${lvOpts}</select></div>
      <button class="primary" id="st-save">Save</button>
      <span id="st-saved" class="muted" style="margin-left:10px"></span>
      <div style="margin-top:18px"><button id="st-reset">Reset onboarding</button></div>
    </div>
    <h1 style="margin-top:26px">Scenario library</h1>
    <p class="sub">${settings.scenarios.length} scenario(s) available.</p>
    <div style="max-width:640px">${scList}</div>`;
  el("st-level").value = settings.default_level;
  el("st-save").onclick = async ()=>{
    settings.default_level = el("st-level").value;
    await fetch("/api/instructor/settings",{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({onboarded:true,default_level:settings.default_level})});
    el("st-saved").textContent = "Saved.";
  };
  wireStarterSaves();
  el("st-reset").onclick = async ()=>{
    await fetch("/api/instructor/settings",{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({onboarded:false,default_level:settings.default_level})});
    settings.onboarded = false; el("shell").classList.add("hidden"); showOnboarding();
  };
}
</script>
</body>
</html>
