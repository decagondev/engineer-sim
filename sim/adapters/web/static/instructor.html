<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Instructor Dashboard</title>
<style>
  :root{
    --ink:#0f1217; --panel:#161b23; --panel-2:#1b212b; --line:#272e3a;
    --text:#e7eaf0; --muted:#8a93a4; --faint:#5c6575;
    --me:#3b6ef5; --them:#1f2632; --ok:#37d67a; --warn:#e0a94a; --bad:#e0655c;
    --chat:#3b6ef5; --mail:#caa24a; --ticket:#c56bff; --sig:#caa24a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--ui);background:var(--ink);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:#3a4353}
  button.primary{background:var(--me);border-color:var(--me);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  select,input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px;font:inherit;outline:none}
  select:focus,input:focus{border-color:var(--me)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
  .badge{font:11px/1 var(--mono);border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
  .hidden{display:none!important}
  .content a{color:var(--me);text-decoration:none}
  .content a:hover{text-decoration:underline}

  .bar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar .brand{font-weight:600}
  .bar .brand .tag{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
  .bar .spacer{flex:1}

  .shell{flex:1;display:flex;min-height:0}
  .side{width:210px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:4px}
  .side .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text)}
  .side .nav:hover{background:var(--panel-2)}
  .side .nav.active{background:var(--panel-2)}
  .side .nav.active::before{content:"";width:3px;align-self:stretch;background:var(--me);border-radius:2px;margin:-10px 2px -10px -12px}
  .content{flex:1;min-width:0;overflow-y:auto;padding:32px max(28px,calc((100% - 860px)/2)) 48px}
  .content.wide{padding:24px 28px}
  .content h1{font-size:20px;margin:0 0 4px}
  .content .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:22px 24px}
  .field{margin-bottom:14px}
  .card .field input,.card .field select{width:100%;box-sizing:border-box}
  .card .field label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px}
  .card .field input[type=checkbox]{width:auto}
  .match{font-size:13px;border-radius:9px;padding:9px 12px;margin:10px 0}
  .match.ok{background:rgba(55,214,122,.1);border:1px solid rgba(55,214,122,.3);color:var(--ok)}
  .match.warn{background:rgba(224,169,74,.1);border:1px solid rgba(224,169,74,.3);color:var(--warn)}
  .match.bad{background:rgba(224,101,92,.1);border:1px solid rgba(224,101,92,.3);color:var(--bad)}

  .st{font:11px/1 var(--mono);border-radius:999px;padding:3px 8px;border:1px solid;white-space:nowrap}
  .kc{display:inline-block;font:11px/1 var(--mono);border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted);margin-right:4px;white-space:nowrap}
  .kc.on{color:#37d67a;border-color:rgba(55,214,122,.5);background:rgba(55,214,122,.08)}
  .kc.on::before{content:"✓ "}
  .rtable{width:100%;border-collapse:collapse;font-size:13px}
  .rtable th{font:600 11px/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  .rtable td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .rtable tr.click{cursor:pointer}.rtable tr.click:hover td{background:var(--panel-2)}
  .rtable .id{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .rtable td.muted,.rtable td .muted{white-space:nowrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
  .filters input,.filters select{padding:7px 10px;font-size:13px}
  .linkbox{display:flex;gap:8px;margin-top:12px}
  .prog{margin-top:14px}
  .prog .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .prog .lab b{color:var(--text);font-variant-numeric:tabular-nums}
  .prog .bar{height:8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:var(--me);transition:width .2s ease}
  .prog .bar.busy i{background-image:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.25) 50%,rgba(255,255,255,0) 100%);background-size:60px 100%;animation:shimmer 1s linear infinite}
  @keyframes shimmer{from{background-position:-60px 0}to{background-position:60px 0}}
  @media (prefers-reduced-motion:reduce){.prog .bar.busy i{animation:none}}
  .linkbox input{flex:1;font-family:var(--mono);font-size:12.5px}

  .srow{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
  .srow:hover{border-color:var(--me)}
  .co-head{margin:14px 0 6px;font-size:13px}
  .co-list{border:1px solid var(--line);border-radius:11px;background:var(--panel);max-height:320px;overflow:auto}
  .co-row{display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
  .co-row:last-child{border-bottom:0}
  .co-row .spacer{flex:1}
  .co-row .id{font-family:var(--mono);font-size:12px}
  .co-row button{font-size:12px;padding:4px 9px}
  .srow .id{font-family:var(--mono);font-size:13px}
  .srow .tags{display:flex;gap:6px}
  .srow .meta{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}

  /* replay */
  #replay{display:flex;height:100%;gap:0}
  .replay-main{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  .replay-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .replay-head .back{cursor:pointer}
  .controls{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .controls .rowa{display:flex;align-items:center;gap:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted);user-select:none}
  .chip.on{color:var(--text);border-color:currentColor}
  .chip.chat.on{color:var(--chat)} .chip.mail.on{color:var(--mail)} .chip.ticket.on{color:var(--ticket)} .chip.sig.on{color:var(--sig)}
  .scrub{display:flex;align-items:center;gap:10px}
  .scrub input[type=range]{flex:1}
  .scrub .pos{font:12px/1 var(--mono);color:var(--muted);min-width:64px;text-align:right}
  .timeline{flex:1;overflow-y:auto;padding:14px 16px}
  .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
  .ev .rail{width:74px;flex:none;font:11px/1.4 var(--mono);color:var(--faint);text-align:right}
  .ev .rail .surface{display:block;font-weight:700}
  .ev.chat .surface{color:var(--chat)} .ev.mail .surface{color:var(--mail)} .ev.ticket .surface{color:var(--ticket)} .ev.sig .surface{color:var(--sig)}
  .ev .who{font-size:13px;font-weight:600}.ev .subj{font-size:12px;color:var(--muted)}
  .ev .txt{font-size:14px;word-wrap:break-word;margin-top:2px}
  .ev .txt.md{white-space:normal}
  .ev.sig .txt{font:12.5px/1.5 var(--mono);color:var(--sig)}
  .replay-side{width:330px;flex:none;overflow-y:auto}
  .replay-side .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .replay-side .head label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;margin:0}
  .replay-side .body{padding:16px}
  .grade .total{font-size:30px;font-weight:700}
  .grade .crit{margin-top:12px}.grade .crit .k{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
  .grade .crit .barx{height:6px;background:var(--panel-2);border-radius:4px;margin:5px 0;overflow:hidden}
  .grade .crit .barx i{display:block;height:100%;background:var(--me)}
  .grade .crit .evd{font-size:12px;color:var(--muted)}
  .grade .crit .evd a.evlink{color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px}
  .grade .crit .evd a.evlink:hover{color:var(--text)}
  .ev.flash{background:rgba(59,110,245,.14);border-radius:8px;transition:background .3s}
  .grade .caveat{margin-top:12px;font:12px/1.5 var(--mono);color:var(--sig);background:rgba(202,162,74,.1);border:1px solid rgba(202,162,74,.28);border-radius:8px;padding:8px 10px}
  .grade .crit .k .rv{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--muted)}
  .grade .crit .k .rv input{width:56px;padding:3px 6px;font-size:12px;text-align:right}
  .grade .crit .k .rv .src{font:10.5px var(--mono);color:#9085e9}
  .grade .review{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .grade .review textarea{width:100%;min-height:64px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
  .grade .review .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .grade .review .st{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted);font-size:13px}

  /* overlays */
  .suspense{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:min(420px,calc(100vh - 140px));padding:24px;color:var(--muted);font-size:13px}
  .spin-lg{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--me);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin-lg{animation:none;border-top-color:var(--line)}}
  .overlay{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:10}
  .overlay .box{width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
  .overlay h1{font-size:19px;margin:0}
  .overlay p{color:var(--muted);font-size:13px;margin:0}
  .overlay .err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>
  <!-- login -->
  <div class="overlay" id="login">
    <div class="box">
      <h1>Instructor access</h1>
      <p>Restricted. Enter the instructor password.</p>
      <input id="pw" type="password" placeholder="Password" autofocus/>
      <div class="err" id="loginerr"></div>
      <button class="primary" id="loginbtn">Enter</button>
    </div>
  </div>

  <!-- onboarding (first run) -->
  <div class="overlay hidden" id="onboard">
    <div class="box">
      <h1>Welcome — let's set you up</h1>
      <p>Pick the engineer level you'll most often run. You can change it any time, and set a different level per session.</p>
      <div style="text-align:left"><label>Default engineer level</label><select id="ob-level" style="width:100%"></select></div>
      <button class="primary" id="ob-save">Get started</button>
    </div>
  </div>

  <div class="bar">
    <span class="brand">Instructor Dashboard<span class="tag" id="scname"></span></span>
    <span class="spacer"></span>
    <a href="/onboarding/instructor/" target="_blank" rel="noopener"><button type="button">Guide</button></a>
    <button id="signout" class="hidden">Sign out</button>
  </div>
  <div class="shell hidden" id="shell">
    <nav class="side">
      <div class="nav active" data-view="overview">Overview</div>
      <div class="nav" data-view="new">New session</div>
      <div class="nav" data-view="cohort">Cohort</div>
      <div class="nav" data-view="sessions">Sessions</div>
      <div class="nav" data-view="settings">Settings</div>
    </nav>
    <div class="content" id="content"><div class="suspense" aria-busy="true" aria-live="polite"><div class="spin-lg" aria-hidden="true"></div><p>Checking your account…</p></div></div>
  </div>

<script src="/static/md.js"></script>
<script src="/static/viz.js"></script>
<script src="/static/vendor/mermaid/mermaid.min.js"></script>
<script src="/static/diagram.js"></script>
<script src="/static/auth.js"></script>
<script>
let token = "", settings = null, authMode = "password";
let rows = [], filtered = [], meta = {personas:[], mail:{}}, idx = 0, playTimer = null, curSid = null;
const filters = {chat:true, mail:true, ticket:true, sig:true};
const el = id => document.getElementById(id);
const esc = s => { const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; };
const hdr = () => {
  const h = {};
  if (token) h["X-Instructor-Token"] = token;
  if (window.SimAuth && SimAuth.token()) h.Authorization = "Bearer " + SimAuth.token();
  return h;
};
const fmt = ts => { const d=new Date(ts); return isNaN(d)?"":d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); };
const fmtDate = ts => { const d=new Date(ts); return isNaN(d)?"":d.toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
const suspense = msg => `<div class="suspense" aria-busy="true" aria-live="polite"><div class="spin-lg" aria-hidden="true"></div><p>${esc(msg)}</p></div>`;
const rankOf = k => (settings.levels.findIndex(l=>l.key===k));
const levelLabel = k => (settings.levels.find(l=>l.key===k)||{}).label || k;

// ---- login + onboarding ----
async function login(){
  const pw = el("pw").value;
  const r = await (await fetch("/api/instructor/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})).json();
  if(!r.ok){ el("loginerr").textContent="Incorrect password."; return; }
  token = pw; el("login").classList.add("hidden");
  el("shell").classList.remove("hidden"); el("content").innerHTML = suspense("Loading your dashboard…");
  settings = await (await fetch("/api/instructor/settings",{headers:hdr()})).json();
  el("scname").textContent = "";
  if(!settings.onboarded){ showOnboarding(); } else { enterDashboard(); }
}
el("loginbtn").onclick = login;
el("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
el("signout").onclick = () => { token = ""; if (window.SimAuth) SimAuth.signOut("/login"); else location.reload(); };

(async function bootAuth(){
  try { const cfg = await SimAuth.config(); authMode = cfg.auth_mode || "password"; } catch (e) { return; }
  if (authMode === "password") return;
  el("login").classList.add("hidden");
  el("signout").classList.remove("hidden");
  if (!SimAuth.token()) { location.href = "/login?next=/instructor"; return; }
  // the shell is visible immediately with a spinner; identity and settings load together
  el("shell").classList.remove("hidden"); el("content").innerHTML = suspense("Loading your dashboard…");
  const [me, st] = await Promise.all([
    SimAuth.me().catch(() => null),
    fetch("/api/instructor/settings",{headers:hdr()}).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  if (!me || (me.role !== "instructor" && me.role !== "admin")) {
    location.href = "/login?next=/instructor"; return;
  }
  settings = st;
  if (!settings) { el("content").innerHTML = `<h1>Instructor</h1><p class="match bad">Could not load your settings. <a href="#" onclick="location.reload();return false;">Try again</a></p>`; return; }
  if(!settings.onboarded){ showOnboarding(); } else { enterDashboard(); }
})();

function showOnboarding(){
  const sel = el("ob-level"); sel.innerHTML = settings.levels.map(l=>`<option value="${l.key}">${l.label}</option>`).join("");
  sel.value = settings.default_level;
  el("onboard").classList.remove("hidden");
}
el("ob-save").onclick = async ()=>{
  const lvl = el("ob-level").value;
  await fetch("/api/instructor/settings",{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({onboarded:true,default_level:lvl})});
  settings.onboarded = true; settings.default_level = lvl;
  el("onboard").classList.add("hidden"); enterDashboard();
};

function enterDashboard(){
  el("shell").classList.remove("hidden");
  const m = location.hash.match(/^#replay=(.+)$/);
  if (m) { history.replaceState(null, "", location.pathname); switchView("sessions"); openReplay(m[1]); return; }
  switchView("overview");
}
// ---- shared dashboard bits (state chips, relative time) ----
const STATE_LABEL = {reviewed:"✓ reviewed", graded:"graded", submitted:"submitted", active:"in progress", not_started:"not started"};
const STATE_COLOR = {reviewed:"#9085e9", graded:"#9085e9", submitted:"#199e70", active:"#3987e5", not_started:"#c98500"};
function stateChip(st, total){ const k = STATE_LABEL[st] ? st : "not_started"; const pct = ((k==="graded"||k==="reviewed") && typeof total==="number") ? ` · ${Math.round(total*100)}%` : ""; return `<span class="st" style="color:${STATE_COLOR[k]};border-color:${STATE_COLOR[k]}">${STATE_LABEL[k]}${pct}</span>`; }
function keyChips(u){
  const g = u.has_groq_key, gh = u.has_github_token;
  return `<span class="kc ${g?"on":""}" title="${g?"Personal Groq key saved":"No personal Groq key"}">Groq</span><span class="kc ${gh?"on":""}" title="${gh?"Personal GitHub token saved":"No personal GitHub token"}">GitHub</span>`;
}
function ago(ts){
  if(!ts) return "—";
  const d = new Date(ts); if (isNaN(d)) return String(ts).slice(0,16);
  const s = (Date.now() - d.getTime())/1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60)+" min ago";
  if (s < 86400) return Math.floor(s/3600)+" h ago"; if (s < 7*86400) return Math.floor(s/86400)+" d ago";
  return d.toLocaleDateString();
}
function scenarioBars(stats){
  return SimViz.hbars(stats.by_scenario.map(b=>({label:b.title, sub:b.key, value:b.total, parts:[
    {value:(b.graded||0)+(b.reviewed||0), color:STATE_COLOR.graded, label:"graded"},
    {value:b.submitted, color:STATE_COLOR.submitted, label:"submitted"},
    {value:b.active, color:STATE_COLOR.active, label:"in progress"},
    {value:b.not_started, color:STATE_COLOR.not_started, label:"not started"}]})), {empty:"No sessions yet."})
    + SimViz.legend([{label:"graded",color:STATE_COLOR.graded},{label:"submitted",color:STATE_COLOR.submitted},{label:"in progress",color:STATE_COLOR.active},{label:"not started",color:STATE_COLOR.not_started}]);
}
function levelBars(stats){
  const lv = stats.by_level.filter(l=>l.count);
  return SimViz.hbars(lv.map(l=>({label:l.level, value:l.count})), {empty:"No sessions yet."});
}


// ---- nav ----
document.querySelectorAll(".side .nav").forEach(n=> n.onclick = ()=> switchView(n.dataset.view));
function switchView(v){
  document.querySelectorAll(".side .nav").forEach(n=> n.classList.toggle("active", n.dataset.view===v));
  el("content").classList.remove("wide");
  if(v==="overview") renderOverview();
  else if(v==="new") renderNew();
  else if(v==="cohort") renderCohort();
  else if(v==="sessions") renderSessions();
  else if(v==="settings") renderSettings();
}

// ---- new session ----
function scenarioOptions(){
  const product = settings.scenarios.filter(s=>s.track!=="systems" && s.track!=="interview");
  const systems = settings.scenarios.filter(s=>s.track==="systems");
  const interview = settings.scenarios.filter(s=>s.track==="interview");
  const opt = s => `<option value="${s.key}" data-diff="${s.difficulty}">${s.title} — ${s.difficulty}</option>`;
  const groups = [];
  if (product.length) groups.push(`<optgroup label="Product engineering">${product.map(opt).join("")}</optgroup>`);
  if (systems.length) groups.push(`<optgroup label="Systems design">${systems.map(opt).join("")}</optgroup>`);
  if (interview.length) groups.push(`<optgroup label="Interview assessment">${interview.map(opt).join("")}</optgroup>`);
  return groups.join("") || product.map(opt).join("");
}
function levelOptions(){
  return settings.levels.map(l=>`<option value="${l.key}">${l.label}</option>`).join("");
}
function renderNew(){
  const scOpts = scenarioOptions();
  const lvOpts = levelOptions();
  // sane default: a scenario whose difficulty matches the default level, else first
  const match = settings.scenarios.find(s=>s.difficulty===settings.default_level);
  el("content").innerHTML = `
    <h1>New session</h1>
    <p class="sub">Assign a scenario and engineer level, then hand the trainee the link.</p>
    <div class="card">
      <div class="field"><label>Scenario</label><select id="ns-sc" style="width:100%">${scOpts}</select></div>
      <div class="field"><label>Engineer level</label><select id="ns-lv" style="width:100%">${lvOpts}</select></div>
      <div class="field"><label>Assign to challenger (email, optional)</label><input id="ns-email" placeholder="student@school.edu"/></div>
      <div id="ns-match" class="match"></div>
      <button class="primary" id="ns-create">Create session & get link</button>
      <div id="ns-result"></div>
    </div>`;
  const scSel = el("ns-sc"), lvSel = el("ns-lv");
  if(match) scSel.value = match.key;
  lvSel.value = settings.default_level;
  const upd = ()=>{
    const diff = scSel.selectedOptions[0].dataset.diff, lv = lvSel.value;
    const gap = rankOf(lv) - rankOf(diff);
    const m = el("ns-match");
    if(gap <= -2){ m.className="match bad"; m.textContent = `This scenario is pitched well above a ${levelLabel(lv)} — likely too hard.`; }
    else if(gap >= 2){ m.className="match warn"; m.textContent = `This scenario may be too easy for a ${levelLabel(lv)}.`; }
    else { m.className="match ok"; m.textContent = `Good match: a ${levelLabel(lv)} on a ${diff}-level scenario.`; }
  };
  scSel.onchange = upd; lvSel.onchange = upd; upd();
  el("ns-create").onclick = async ()=>{
    const email = (el("ns-email") && el("ns-email").value.trim()) || "";
    const created = await (await fetch(`/api/instructor/sessions`,{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({scenario:scSel.value,level:lvSel.value,assignee_email:email})})).json();
    const sid = created.session_id;
    if(!sid){ el("ns-result").innerHTML = `<div class="match bad">Could not create session.</div>`; return; }
    const link = `${location.origin}/#${sid}`;
    el("ns-result").innerHTML = `
      <div class="match ok" style="margin-top:16px">Session created: <b>${sid}</b></div>
      <label style="margin-top:12px">Trainee link — send this to the engineer</label>
      <div class="linkbox"><input id="ns-link" readonly value="${link}"/><button id="ns-copy">Copy</button></div>
      <div style="margin-top:12px"><button id="ns-watch">Open replay for this session</button></div>`;
    el("ns-copy").onclick = ()=>{ navigator.clipboard.writeText(link); el("ns-copy").textContent="Copied"; };
    el("ns-watch").onclick = ()=> openReplay(sid);
  };
}

async function renderCohort(){
  el("content").innerHTML = `<h1>Cohort</h1><p class="sub">Create one session per challenger in a cohort, all on the same scenario and level.</p><div id="co-body">${suspense("Loading cohorts…")}</div>`;
  const data = await (await fetch("/api/instructor/cohorts",{headers:hdr()})).json();
  const cohorts = data.cohorts || [];
  const body = el("co-body");
  if(!cohorts.length){
    body.innerHTML = `<div class="card"><div class="muted">No cohorts yet. An admin creates cohorts and adds challengers under <a href="/admin">Admin → Cohorts</a>.</div></div>`;
    return;
  }
  const coOpts = cohorts.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${c.challenger_count} challenger${c.challenger_count===1?"":"s"}</option>`).join("");
  body.innerHTML = `
    <div class="card">
      <div class="field"><label>Cohort</label><select id="co-sel" style="width:100%">${coOpts}</select></div>
      <div class="field"><label>Scenario</label><select id="co-sc" style="width:100%">${scenarioOptions()}</select></div>
      <div class="field"><label>Engineer level</label><select id="co-lv" style="width:100%">${levelOptions()}</select></div>
      <div class="field"><label><input type="checkbox" id="co-skip" checked/> Skip challengers who already have this scenario</label></div>
      <div id="co-members" class="muted">Loading members…</div>
      <button class="primary" id="co-create">Create sessions</button>
      <button id="co-results" type="button">Results for this scenario</button>
      <div id="co-result"></div>
    </div>`;
  const coSel = el("co-sel"), scSel = el("co-sc"), lvSel = el("co-lv"), skip = el("co-skip");
  const match = settings.scenarios.find(s=>s.difficulty===settings.default_level);
  if(match) scSel.value = match.key;
  lvSel.value = settings.default_level;
  let members = [];
  const who = m => (m.name ? `<span>${esc(m.name)}</span><span class="muted">${esc(m.email)}</span>` : `<span>${esc(m.email || m.uid)}</span>`) + (m.role==="challenger" && ("has_groq_key" in m) ? `<span>${keyChips(m)}</span>` : "");
  async function loadMembers(){
    el("co-members").innerHTML = suspense("Loading members…");
    const d = await (await fetch(`/api/instructor/cohorts/${encodeURIComponent(coSel.value)}?scenario=${encodeURIComponent(scSel.value)}`,{headers:hdr()})).json();
    members = d.members || [];
    renderMembers();
  }
  function renderMembers(){
    const ready = members.filter(m=>!m.blocked && !(skip.checked && m.sessions.length));
    const rows = members.map(m=>{
      const has = m.sessions.length;
      let note = "";
      if(m.blocked) note = `<span class="badge">${esc(m.blocked)}</span>`;
      else if(has) note = `<span class="badge">${skip.checked ? "will skip — has " : "has "}${esc(m.sessions[0].session_id)}</span>`;
      else note = `<span class="badge">new session</span>`;
      return `<div class="co-row">${who(m)}<span class="spacer"></span>${note}</div>`;
    }).join("");
    el("co-members").innerHTML = `
      <div class="co-head"><b>${members.length} member${members.length===1?"":"s"}</b><span class="muted"> · ${ready.length} will get a session</span></div>
      <div class="co-list">${rows || `<div class="muted" style="padding:10px 13px">This cohort has no members.</div>`}</div>`;
    el("co-create").textContent = ready.length ? `Create ${ready.length} session${ready.length===1?"":"s"}` : "Nothing to create";
    el("co-create").disabled = !ready.length;
  }
  coSel.onchange = loadMembers; scSel.onchange = loadMembers; skip.onchange = renderMembers;
  await loadMembers();
  el("co-results").onclick = async () => {
    el("co-result").innerHTML = suspense("Collecting grades…");
    let d;
    try { d = await (await fetch(`/api/instructor/cohorts/${encodeURIComponent(coSel.value)}/results?scenario=${encodeURIComponent(scSel.value)}&fresh=1`,{headers:hdr()})).json(); }
    catch(e){ el("co-result").innerHTML = `<div class="match bad">Could not load results.</div>`; return; }
    if (d.error) { el("co-result").innerHTML = `<div class="match bad">${esc(d.error)}</div>`; return; }
    const r = d.report, pct = x => x==null ? "—" : Math.round(x*100)+"%";
    const strip = c => c.n ? `<svg viewBox="0 0 100 10" preserveAspectRatio="none" style="width:100%;height:10px;display:block">${c.values.map(v=>`<rect x="${(v*100).toFixed(1)}" y="0" width="1.2" height="10" fill="#3987e5" opacity=".7"/>`).join("")}<rect x="${(c.q1*100).toFixed(1)}" y="3" width="${((c.q3-c.q1)*100).toFixed(1)}" height="4" fill="none" stroke="#8a93a4" stroke-width=".8"/></svg>` : "";
    el("co-result").innerHTML = `
      <div class="match ok" style="margin-top:16px"><b>${esc(d.title)}</b> · ${r.members.length} members · ${r.submitted} submitted · ${r.graded} graded · mean ${pct(r.total_mean)} · median ${pct(r.total_median)}</div>
      <div class="linkbox"><a href="/api/instructor/cohorts/${encodeURIComponent(coSel.value)}/results.csv?scenario=${encodeURIComponent(scSel.value)}" target="_blank" rel="noopener"><button>Download CSV</button></a></div>
      <div class="co-head" style="margin-top:12px"><b>Per criterion</b> <span class="muted">· mean, median, and each member's score (box = middle half)</span></div>
      <table class="rtable"><thead><tr><th>Criterion</th><th>n</th><th>Mean</th><th>Median</th><th>Low</th><th>High</th><th style="min-width:160px">Distribution</th></tr></thead><tbody>${
        r.criteria.map(c=>`<tr><td>${esc(c.key)}</td><td>${c.n}</td><td>${pct(c.mean)}</td><td>${pct(c.median)}</td><td>${pct(c.lowest)}</td><td>${pct(c.highest)}</td><td>${strip(c)}</td></tr>`).join("")}</tbody></table>
      <div class="co-head" style="margin-top:14px"><b>Members</b>${r.not_submitted.length ? ` <span class="muted">· ${r.not_submitted.length} not submitted</span>` : ""}</div>
      <table class="rtable"><thead><tr><th>Name</th><th>State</th><th>Model</th><th>Reviewed</th>${r.criteria.map(c=>`<th>${esc(c.key)}</th>`).join("")}<th></th></tr></thead><tbody>${
        r.members.map(m=>`<tr><td>${esc(m.name||m.email)}<div class="muted">${esc(m.email)}</div></td><td>${m.state==="no_session" ? `<span class="muted">no session</span>` : stateChip(m.state)}</td><td>${pct(m.model_total)}</td><td>${pct(m.review_total)}</td>${r.criteria.map(c=>`<td>${m.scores[c.key]==null?"—":pct(m.scores[c.key])}</td>`).join("")}<td>${m.session_id ? `<button data-replay="${esc(m.session_id)}">Replay</button>` : ""}</td></tr>`).join("")}</tbody></table>`;
    el("co-result").querySelectorAll("[data-replay]").forEach(b=> b.onclick = ()=> openReplay(b.dataset.replay));
  };
  el("co-create").onclick = async ()=>{
    const btn = el("co-create");
    btn.disabled = true;
    const label = btn.textContent;
    // create in small batches so the bar moves as sessions land
    const ready = members.filter(m=>!m.blocked && !(skip.checked && m.sessions.length));
    const total = ready.length, BATCH = 5;
    el("co-result").innerHTML = `<div class="prog"><div class="lab"><span id="co-plab">Creating sessions…</span><b id="co-pcount">0 / ${total}</b></div><div class="bar busy"><i id="co-pbar"></i></div></div>`;
    const setProg = (n, text) => { el("co-pcount").textContent = `${n} / ${total}`; el("co-pbar").style.width = (total ? (n/total)*100 : 100) + "%"; if(text) el("co-plab").textContent = text; };
    btn.textContent = "Creating…";
    const r = { ok:true, created:[], skipped:[], cohort:null, level:lvSel.value };
    let done = 0;
    try {
      for(let i=0;i<ready.length;i+=BATCH){
        const chunk = ready.slice(i, i+BATCH);
        const resp = await fetch(`/api/instructor/cohorts/${encodeURIComponent(coSel.value)}/sessions`,{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({scenario:scSel.value,level:lvSel.value,skip_existing:skip.checked,uids:chunk.map(m=>m.uid)})});
        const part = await resp.json().catch(()=>({}));
        if(!resp.ok || !part.ok){
          el("co-result").innerHTML = `<div class="match bad">${esc(part.error||"Could not create sessions.")} ${done ? `${done} of ${total} were created before the error; press the button again to continue.` : ""}</div>`;
          btn.disabled=false; btn.textContent = label; await loadMembers(); return;
        }
        r.created.push(...(part.created||[])); r.skipped.push(...(part.skipped||[]));
        r.cohort = part.cohort || r.cohort; r.level = part.level || r.level;
        done = Math.min(total, done + chunk.length);
        setProg(done, done < total ? `Creating sessions… ${esc((chunk[chunk.length-1].name||chunk[chunk.length-1].email||""))}` : "Done");
      }
    } catch(e){
      el("co-result").innerHTML = `<div class="match bad">Network error after ${done} of ${total}. Reload the members list and press the button again; existing sessions are skipped.</div>`;
      btn.disabled=false; btn.textContent = label; return;
    }
    el("co-pbar").parentElement.classList.remove("busy");
    btn.textContent = label;
    const link = sid => `${location.origin}/#${sid}`;
    const lines = r.created.map(c=>`${c.name||c.email}${c.name?" <"+c.email+">":""}: ${link(c.session_id)}`).join("\n");
    const q = v => '"' + String(v||"").split('"').join('""') + '"';
    const csv = ["name,email,session_id,link", ...r.created.map(c=>[c.name,c.email,c.session_id,link(c.session_id)].map(q).join(","))].join("\n");
    const rows = r.created.map(c=>`
      <div class="co-row">${who(c)}<span class="spacer"></span>
        <span class="id">${esc(c.session_id)}</span>
        <button data-copy="${esc(link(c.session_id))}">Copy link</button>
        <button data-replay="${esc(c.session_id)}">Replay</button></div>`).join("");
    const skipped = r.skipped.map(x=>`<div class="co-row">${who(x)}<span class="spacer"></span><span class="badge">${esc(x.reason)}${x.session_id?" · "+esc(x.session_id):""}</span></div>`).join("");
    el("co-result").innerHTML = `
      <div class="match ok" style="margin-top:16px">Created <b>${r.created.length}</b> session${r.created.length===1?"":"s"} on <b>${esc(scSel.options[scSel.selectedIndex].text)}</b> at <b>${levelLabel(r.level)}</b>${r.skipped.length?` · skipped ${r.skipped.length}`:""}</div>
      ${r.created.length ? `<div class="linkbox"><button id="co-copyall">Copy all links</button><button id="co-csv">Download CSV</button></div>` : ""}
      <div class="co-list">${rows}</div>
      ${skipped ? `<div class="co-head" style="margin-top:12px"><b>Skipped</b></div><div class="co-list">${skipped}</div>` : ""}`;
    const copyAll = el("co-copyall");
    if(copyAll) copyAll.onclick = ()=>{ navigator.clipboard.writeText(lines); copyAll.textContent = "Copied"; };
    const dl = el("co-csv");
    if(dl) dl.onclick = ()=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download = `${(r.cohort.name||"cohort").replace(/[^\w-]+/g,"_")}-${scSel.value}.csv`;
      a.click(); URL.revokeObjectURL(a.href);
    };
    el("co-result").querySelectorAll("[data-copy]").forEach(b=> b.onclick = ()=>{ navigator.clipboard.writeText(b.dataset.copy); b.textContent="Copied"; });
    el("co-result").querySelectorAll("[data-replay]").forEach(b=> b.onclick = ()=> openReplay(b.dataset.replay));
    await loadMembers();
  };
}

async function loadDiagram(){

}
function jumpToMessage(id){
  // make sure the message is on the timeline (chat filter on, scrubbed far enough), then flash it
  if (!filters.chat) { filters.chat = true; const c = document.querySelector('.chip[data-f="chat"]'); if (c) c.classList.add("on"); applyFilter(); }
  const pos = filtered.findIndex(m => m.id === id);
  if (pos < 0) return;
  if (idx <= pos) { idx = pos + 1; syncScrub(); }
  renderTimeline();
  const row = el("timeline").querySelector(`.ev[data-id="${id}"]`);
  if (!row) return;
  row.scrollIntoView({block: "center", behavior: "smooth"});
  row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1800);
}
function surfaceOf(m){ return m.kind==="email"?"mail":m.kind==="ticket"?"ticket":m.kind==="event"?"sig":"chat"; }
function applyFilter(){ filtered = rows.filter(m=> filters[surfaceOf(m)]); }
function nameOf(k){ const p=meta.personas.find(x=>x.key===k); return p?p.name:(k==="tester"?"You":k); }
function renderTimeline(){
  const tl = el("timeline"); tl.innerHTML="";
  filtered.slice(0,idx).forEach(m=> tl.appendChild(renderEv(m)));
  tl.scrollTop = tl.scrollHeight; el("pos").textContent = `${idx} / ${filtered.length}`;
}
function renderEv(m){
  const s = surfaceOf(m), d = document.createElement("div"); d.className="ev "+s;
  if (m.id != null) d.dataset.id = m.id;
  const label = {chat:"CHAT",mail:"MAIL",ticket:"TICKET",sig:"SIGNAL"}[s];
  let who="", subj="";
  if(s==="chat") who=nameOf(m.sender);
  else if(s==="mail"){ who=nameOf(m.sender); const mm=meta.mail[m.channel]; subj=mm?("Re: "+mm.subject):""; }
  else if(s==="ticket") who="Tickets";
  d.innerHTML = `<div class="rail"><span class="surface">${label}</span>${fmt(m.ts)}</div>`+
    `<div><div class="who">${esc(who)}</div>${subj?`<div class="subj">${esc(subj)}</div>`:""}<div class="txt md">${window.SimMD?SimMD.render(m.content):esc(m.content)}</div></div>`;
  return d;
}
function syncScrub(){ const sc=el("scrub"); sc.max=filtered.length; sc.value=idx; el("pos").textContent=`${idx} / ${filtered.length}`; }
function wireReplay(){
  if (window.SimMD) SimMD.hydrate(el("timeline"));
  if (window.SimDiagram) SimDiagram.hydrate(el("timeline"));
  el("scrub").addEventListener("input", e=>{ idx=+e.target.value; renderTimeline(); });
  el("play").onclick = ()=>{
    if(playTimer){ stopPlay(); return; }
    if(idx>=filtered.length) idx=0;
    el("play").textContent="❚❚ Pause";
    playTimer = setInterval(()=>{ if(idx>=filtered.length){ stopPlay(); return; } idx++; el("scrub").value=idx; renderTimeline(); }, 650);
  };
  el("chips").addEventListener("click", e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    filters[c.dataset.f]=!filters[c.dataset.f]; c.classList.toggle("on",filters[c.dataset.f]);
    applyFilter(); idx=Math.min(idx,filtered.length); syncScrub(); renderTimeline();
  });
  el("gradeBtn").onclick = doGrade;
  el("exportBtn").onclick = doExport;
}
function stopPlay(){ clearInterval(playTimer); playTimer=null; const p=el("play"); if(p) p.textContent="▶ Play"; }
function renderGrade(g){
  const scores = (g.scores||[]).map(s=>({...s}));
  if (g.tickets_extra) scores.push({key:"tickets", label:"tickets (extra credit)", score:g.tickets_extra.score, evidence:g.tickets_extra.evidence, source:g.tickets_extra.source||"model", model_score:g.tickets_extra.model_score});
  const rv = g.review || null;
  const crits = scores.map(s=>{
    const pct = Math.round((s.score||0)*100);
    const human = s.source==="human";
    return `<div class="crit"><div class="k"><span>${esc(s.label||s.key)}</span>
      <span class="rv">${human ? `<span class="src">instructor · model ${Math.round((s.model_score||0)*100)}%</span>` : ""}
        <input type="number" min="0" max="100" step="1" data-rv="${esc(s.key)}" value="${pct}" title="Your score for ${esc(s.key)} (percent)"/>%</span></div>
      <div class="barx"><i style="width:${pct}%${human?";background:#9085e9":""}"></i></div><div class="evd">${s.evidence_ref != null ? `<a href="#" class="evlink" data-ref="${s.evidence_ref}" title="Show this in the transcript">${esc(s.evidence)}</a>` : esc(s.evidence)}</div></div>`;
  }).join("");
  const caveat = g.calibrated ? "" : `<div class="caveat">${esc(g.caveat||"grader not calibrated")}</div>`;
  const extraNote = g.include_tickets ? ` · base ${(g.total_base*100|0)}% + tickets extra credit` : "";
  const when = g.graded_at ? `<div class="muted" style="margin-top:4px">Model grade saved ${ago(g.graded_at)}${g.graded_by ? " by " + esc(g.graded_by) : ""}. Press Regrade to replace it.</div>` : "";
  const reviewed = rv ? `<div class="muted" style="margin-top:2px">Reviewed ${ago(rv.ts)}${rv.reviewer ? " by " + esc(rv.reviewer) : ""}${g.total_model!=null ? ` · model total ${Math.round(g.total_model*100)}%` : ""}</div>` : "";
  el("gradebody").innerHTML = `<div class="grade"><div class="total">${(g.total*100|0)}%${rv?` <span class="muted" style="font-size:13px;font-weight:400">reviewed</span>`:""}</div><div class="muted">graded at ${levelLabel(g.level)} expectations${extraNote}</div>${when}${reviewed}${crits}<div style="margin-top:12px">${esc(g.summary)}</div>${caveat}
    <div class="review"><b style="font-size:13px">Your review</b><div class="muted" style="font-size:12px;margin:2px 0 8px">Change any score above, add a comment, and save. The model grade stays on record; challengers and the export see your verdict.</div>
      <textarea id="rv-comment" placeholder="What they did well, what to work on…">${esc(rv ? rv.comment : "")}</textarea>
      <div class="row"><button class="primary" id="rv-save" type="button">Save review</button>${rv ? `<button id="rv-clear" type="button">Clear review</button>` : ""}<span class="st" id="rv-status"></span></div></div></div>`;
  el("gradeBtn").textContent = "Regrade";
  if (el("includeTickets")) el("includeTickets").checked = !!g.include_tickets;
  el("gradebody").querySelectorAll(".evlink").forEach(a => a.onclick = e => { e.preventDefault(); jumpToMessage(+a.dataset.ref); });
  el("rv-save").onclick = async () => {
    const overrides = {};
    scores.forEach(s => {
      const inp = el("gradebody").querySelector(`[data-rv="${CSS.escape(s.key)}"]`);
      const v = parseInt(inp.value, 10);
      const orig = Math.round(((s.source==="human" ? s.model_score : s.score)||0)*100);
      if (!isNaN(v) && (v !== orig || s.source==="human")) overrides[s.key] = v / 100;
    });
    el("rv-status").textContent = "Saving…";
    const r = await fetch(`/api/instructor/session/${curSid}/review`,{method:"PUT",headers:{"Content-Type":"application/json",...hdr()},body:JSON.stringify({scores:overrides, comment:el("rv-comment").value})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ el("rv-status").textContent = d.error || "Could not save."; return; }
    if (d.grade) renderGrade(d.grade); else el("rv-status").textContent = "Saved. Grade the run to see it merged.";
  };
  const clr = el("rv-clear");
  if (clr) clr.onclick = async () => {
    await fetch(`/api/instructor/session/${curSid}/review`,{method:"DELETE",headers:hdr()});
    loadStoredGrade();
  };
}
async function loadStoredGrade(){
  try {
    const r = await fetch(`/api/session/${curSid}/grade`,{headers:hdr()});
    if (!r.ok) { el("gradeBtn").textContent = "Grade"; return; }
    renderGrade(await r.json());
  } catch(e) {}
}
async function doGrade(){
  el("gradebody").innerHTML = `<div class="muted">Grading…</div>`;
  const includeTickets = !!(el("includeTickets") && el("includeTickets").checked);
  const g = await (await fetch(`/api/session/${curSid}/grade`,{method:"POST",headers:{"Content-Type":"application/json",...hdr()},body:JSON.stringify({include_tickets:includeTickets})})).json();
  if(g.error){ el("gradebody").innerHTML=`<div class="muted">Grade error: ${g.error}</div>`; return; }
  renderGrade(g);
}
async function doExport(){
  const includeTickets = !!(el("includeTickets") && el("includeTickets").checked);
  const r = await fetch(`/api/instructor/session/${curSid}/export.md?include_tickets=${includeTickets? "true":"false"}`,{headers:hdr()});
  if(!r.ok){ el("gradebody").innerHTML=`<div class="muted">Export failed (${r.status})</div>`; return; }
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${curSid}-audit.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function wireStarterSaves(){
  document.querySelectorAll('.savestarter').forEach(b=> b.onclick = async ()=>{
    const key=b.dataset.key;
    const url=document.querySelector('.starter[data-key="'+key+'"]').value.trim();
    await fetch('/api/instructor/scenario/'+key+'/starter-url',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({url})});
    b.textContent='Saved'; setTimeout(()=>b.textContent='Save',1200);
    const sc=settings.scenarios.find(s=>s.key===key); if(sc) sc.starter_url=url;
  });
}

// ---- settings ----
function renderSettings(){
  const lvOpts = settings.levels.map(l=>`<option value="${l.key}">${l.label}</option>`).join("");
  const scList = settings.scenarios.map(s=>`<div class="srow" style="cursor:default;flex-wrap:wrap">
      <span class="id">${s.title}</span><span class="tags"><span class="badge">${s.track==="interview"?"Interview":s.track==="systems"?"Systems":"Product"}</span><span class="badge">${s.difficulty}</span></span>
      <div style="flex-basis:100%;display:flex;gap:8px;margin-top:8px">
        <input class="starter" data-key="${s.key}" placeholder="public GitHub starter repo URL (optional)" value="${s.starter_url||''}" style="flex:1;font-size:12px"/>
        <button class="savestarter" data-key="${s.key}">Save</button>
      </div></div>`).join("");
  el("content").innerHTML = `
    <h1>Settings</h1><p class="sub">Defaults and library.</p>
    <div class="card">
      <div class="field"><label>Default engineer level (used when a session has none set)</label>
        <select id="st-level" style="width:100%">${lvOpts}</select></div>
      <button class="primary" id="st-save">Save</button>
      <span id="st-saved" class="muted" style="margin-left:10px"></span>
      <div style="margin-top:18px"><button id="st-reset">Reset onboarding</button></div>
    </div>
    <h1 style="margin-top:26px">Scenario library</h1>
    <p class="sub">${settings.scenarios.length} scenario(s) available.</p>
    <div style="max-width:640px">${scList}</div>`;
  el("st-level").value = settings.default_level;
  el("st-save").onclick = async ()=>{
    settings.default_level = el("st-level").value;
    await fetch("/api/instructor/settings",{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({onboarded:true,default_level:settings.default_level})});
    el("st-saved").textContent = "Saved.";
  };
  wireStarterSaves();
  el("st-reset").onclick = async ()=>{
    await fetch("/api/instructor/settings",{method:"POST",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({onboarded:false,default_level:settings.default_level})});
    settings.onboarded = false; el("shell").classList.add("hidden"); showOnboarding();
  };
}
</script>
</body>
</html>
