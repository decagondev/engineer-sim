<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Workstation</title>
<style>
  :root{
    --ink:#12151b; --panel:#161b23; --panel-2:#1b212b; --line:#272e3a;
    --text:#e7eaf0; --muted:#8a93a4; --faint:#5c6575;
    --me:#3b6ef5; --me-ink:#fff; --them:#1f2632;
    --sig:#caa24a; --sig-bg:rgba(202,162,74,.10); --sig-line:rgba(202,162,74,.28);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:15px/1.5 var(--ui);background:#0d1015;color:var(--text);height:100vh;overflow:hidden}

  /* menu bar */
  #menubar{height:30px;display:flex;align-items:center;gap:12px;padding:0 14px;
           background:rgba(16,19,26,.7);backdrop-filter:blur(12px);
           border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;position:relative;z-index:5}
  #menubar .brand{font-weight:600}
  #menubar .app-name{color:var(--muted)}
  #menubar .spacer{flex:1}
  #menubar .clock{font-family:var(--mono);color:var(--muted);font-size:12px}

  /* the desktop stage + wallpaper */
  #stage{position:absolute;inset:30px 0 0 0;overflow:hidden;
    background:
      radial-gradient(1100px 700px at 18% 4%, rgba(96,132,214,.30), transparent 55%),
      radial-gradient(1000px 720px at 102% 102%, rgba(58,150,150,.24), transparent 55%),
      linear-gradient(135deg,#16233d 0%,#1b2b46 45%,#1f3f49 100%)}

  /* hero shown when no app is open */
  #desktop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:8px;text-align:center;padding-bottom:96px}
  #desktop h1{margin:0;font-size:23px;font-weight:600;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.45)}
  #desktop .sub{color:rgba(255,255,255,.78);font-size:14px}

  /* a real, floating window */
  #window{position:absolute;top:18px;left:26px;right:26px;bottom:96px;background:var(--ink);
          border:1px solid rgba(255,255,255,.10);border-radius:13px;overflow:hidden;
          display:flex;flex-direction:column;box-shadow:0 26px 70px rgba(0,0,0,.55)}
  #winbar{height:40px;flex:none;display:flex;align-items:center;gap:9px;padding:0 13px;
          background:var(--panel);border-bottom:1px solid var(--line)}
  #winbar .close{width:12px;height:12px;border-radius:50%;background:#e0655c;
                 border:none;cursor:pointer;padding:0}
  #winbar .close:hover{filter:brightness(1.12)}
  #winbar .wintitle{font-size:13px;font-weight:600}
  #winbody{flex:1;min-height:0;position:relative}

  /* dock */
  #dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;
        padding:9px 11px;border-radius:18px;background:rgba(18,22,30,.55);backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,.10);box-shadow:0 12px 34px rgba(0,0,0,.4);z-index:4}
  .dockitem{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;cursor:pointer;
            background:var(--panel-2);border:1px solid var(--line);position:relative;
            transition:transform .12s ease}
  .dockitem:hover{transform:translateY(-4px)}
  .dockitem svg{width:24px;height:24px;display:block;stroke:var(--text);fill:none;stroke-width:1.6}
  .dockitem.stub svg{stroke:var(--muted)}
  .dockitem.active::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
            width:4px;height:4px;border-radius:50%;background:#fff}
  .dockitem .tip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);white-space:nowrap;
            background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;
            opacity:0;pointer-events:none;transition:opacity .1s}
  .dockitem:hover .tip{opacity:1}
  .dockitem:focus-visible{outline:2px solid var(--me);outline-offset:2px}
  .dockitem .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;
        border-radius:9px;background:#e0655c;color:#fff;font-size:11px;font-weight:700;
        display:none;place-items:center;border:2px solid rgba(18,22,30,.9)}
  .dockitem .badge.on{display:grid}

  /* shared stub styling for inert apps */
  .stub{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:12px;color:var(--muted);text-align:center;padding:24px}
  .stub .g{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;
           background:var(--panel-2);border:1px solid var(--line)}
  .stub .g svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.6}
  .stub h2{margin:0;color:var(--text);font-size:18px}
  .stub p{margin:0;max-width:360px;font-size:14px}
  .stub .tag{font:11px/1 var(--mono);color:var(--faint);border:1px solid var(--line);
             border-radius:999px;padding:5px 10px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div id="menubar">
    <span class="brand" id="brand">Workstation</span>
    <span class="app-name" id="appname"></span>
    <span class="spacer"></span>
    <span class="clock" id="clock"></span>
  </div>
  <div id="stage">
    <div id="desktop">
      <h1 id="hero">Workstation</h1>
      <div class="sub">Open an app from the dock to start your shift.</div>
    </div>
    <div id="window" style="display:none">
      <div id="winbar"><button class="close" id="close" title="Close"></button><span class="wintitle" id="wintitle"></span></div>
      <div id="winbody"></div>
    </div>
    <div id="dock"></div>
  </div>

  <script src="/static/shell.js"></script>
  <script src="/static/apps/chat.js"></script>
  <script src="/static/apps/workspace.js"></script>
  <script src="/static/apps/email.js"></script>
  <script src="/static/apps/files.js"></script>
  <script src="/static/apps/tickets.js"></script>
  <script src="/static/apps/submit.js"></script>
  <script>SimApps.boot();</script>
</body>
</html>
