<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in</title>
<style>
  :root{
    --ink:#0f1217; --panel:#161b23; --line:#272e3a; --text:#e7eaf0; --muted:#8a93a4;
    --me:#3b6ef5; --bad:#e0655c;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--ui);background:var(--ink);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:19px;margin:0}
  p{color:var(--muted);font-size:13px;margin:0}
  #form{display:flex;flex-direction:column;gap:10px}
  input,select{background:#12151b;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;font:inherit;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--me)}
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text);
    caret-color:var(--text);
    box-shadow:0 0 0 1000px #12151b inset;
    transition:background-color 9999s ease-out 0s;
  }
  button{background:var(--me);border:0;color:#fff;font-weight:600;border-radius:9px;padding:11px 14px;cursor:pointer;font:inherit;width:100%}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.ghost:hover{background:#1b212b}
  button.link{background:transparent;border:0;color:var(--muted);font-weight:500;padding:4px 0;width:auto;align-self:center}
  button.link:hover{color:var(--text);filter:none}
  button:disabled{opacity:.65;cursor:wait;filter:none}
  .err{color:var(--bad);font-size:13px;min-height:18px}
  a{color:var(--me)}
  .load{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
  .load.dim{background:rgba(15,18,23,.78)}
  .load.hidden{display:none}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--me);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load p{color:var(--text);font-size:14px}
</style>
</head>
<body>
<div class="load" id="load" aria-live="polite" aria-busy="true">
  <div class="spin" aria-hidden="true"></div>
  <p id="load-msg">Loading…</p>
</div>
<div class="box">
  <h1>Sign in</h1>
  <p id="blurb">Use the email your instructor gave you.</p>
  <div id="form"></div>
  <div class="err" id="err"></div>
</div>
<script src="/static/auth.js"></script>
<script>
const next = new URLSearchParams(location.search).get("next") || "";
const el = id => document.getElementById(id);

function homeFor(role){
  if (next) return next;
  if (role === "admin") return "/admin";
  if (role === "instructor") return "/instructor";
  return "/challenger";
}

function showLoad(msg, dim){
  const load = el("load");
  el("load-msg").textContent = msg || "Loading…";
  load.classList.toggle("dim", !!dim);
  load.classList.remove("hidden");
  load.setAttribute("aria-busy", "true");
}

function hideLoad(){
  const load = el("load");
  load.classList.add("hidden");
  load.classList.remove("dim");
  load.setAttribute("aria-busy", "false");
}

async function withLoad(msg, fn){
  el("err").textContent = "";
  showLoad(msg, true);
  document.querySelectorAll("#form button").forEach(b => { b.disabled = true; });
  try {
    await fn();
  } catch (e) {
    el("err").textContent = e.message || String(e);
    hideLoad();
  } finally {
    document.querySelectorAll("#form button").forEach(b => { b.disabled = false; });
  }
}

(async function(){
  let cfg;
  try {
    cfg = await SimAuth.config();
  } catch (e) {
    el("err").textContent = "Could not reach the server.";
    hideLoad();
    return;
  }
  if (cfg.auth_mode === "password") {
    el("blurb").textContent = "This server is using the classroom password. Instructors sign in at the instructor dashboard.";
    el("form").innerHTML = `<a href="/instructor">Instructor dashboard</a> · <a href="/">Workstation</a>`;
    hideLoad();
    return;
  }
  if (cfg.auth_mode === "fake") {
    el("blurb").textContent = "Dev auth (AUTH_MODE=fake). No Firebase project required.";
    el("form").innerHTML = `
      <input id="email" placeholder="email@test.local" value="dev@test.local"/>
      <input id="uid" placeholder="uid" value="dev"/>
      <select id="role">
        <option value="challenger">challenger</option>
        <option value="instructor">instructor</option>
        <option value="admin">admin</option>
      </select>
      <button id="go" type="button">Sign in</button>`;
    hideLoad();
    el("go").onclick = () => withLoad("Signing in…", async () => {
      const uid = el("uid").value.trim() || "dev";
      const role = el("role").value;
      const email = el("email").value.trim() || (uid + "@test.local");
      SimAuth.setToken(`fake:${uid}:${role}:${email}`);
      const me = await SimAuth.me();
      if (!me) throw new Error("Sign-in failed.");
      location.href = homeFor(me.role);
    });
    return;
  }
  el("form").innerHTML = `
    <input id="email" type="email" placeholder="Email" autocomplete="username"/>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password"/>
    <button id="go" type="button">Sign in</button>
    ${cfg.allow_signup === false ? "" : `<button class="ghost" id="up" type="button">Create challenger account</button>`}
    <button class="link" id="reset" type="button">Forgot password?</button>`;
  const fb = cfg.firebase || {};
  function bootFail(){
    el("err").textContent = "Could not load Firebase. Check your connection and refresh.";
    hideLoad();
  }
  const s1 = document.createElement("script");
  s1.src = "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js";
  const s2 = document.createElement("script");
  s2.src = "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js";
  s1.onerror = bootFail;
  s2.onerror = bootFail;
  document.body.appendChild(s1);
  s1.onload = () => document.body.appendChild(s2);
  s2.onload = () => {
    firebase.initializeApp({
      apiKey: fb.apiKey, authDomain: fb.authDomain, projectId: fb.projectId,
    });
    const auth = firebase.auth();
    async function after(cred) {
      const t = await cred.user.getIdToken();
      SimAuth.setToken(t);
      const me = await SimAuth.me();
      if (!me) throw new Error("Server rejected the token. Check FIREBASE_WEB_API_KEY.");
      location.href = homeFor(me.role);
    }
    el("go").onclick = () => withLoad("Signing in…", async () => {
      const cred = await auth.signInWithEmailAndPassword(el("email").value, el("pw").value);
      await after(cred);
    });
    el("pw").addEventListener("keydown", e => {
      if (e.key === "Enter") el("go").click();
    });
    if (el("up")) el("up").onclick = () => withLoad("Creating account…", async () => {
      const cred = await auth.createUserWithEmailAndPassword(el("email").value, el("pw").value);
      await after(cred);
    });
    el("reset").onclick = () => withLoad("Sending reset email…", async () => {
      await auth.sendPasswordResetEmail(el("email").value, { url: location.origin + "/login" });
      el("err").textContent = "Reset email sent (if that account exists).";
      hideLoad();
    });
    hideLoad();
  };
})();
</script>
</body>
</html>
