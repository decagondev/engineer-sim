[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not eval'"
markers = [
    "eval: real-model, non-gating eval (skipped unless LLM_PROVIDER is real)",
    "firebase: live Firebase Auth (skipped unless FIREBASE_TEST=1)",
    "firestore: live Firestore (skipped unless FIRESTORE_TEST=1)",
]

